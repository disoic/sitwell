<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   Interface
   ============================================================ */
(function () {
  const $ = s => document.querySelector(s);
  const ZURICH = { lat: 47.3686, lon: 8.5392 };
  const PAGE = 20;
  const ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
  ];
  const EVENTS_KEY = 'pause.events.v1';
  const TEST = new URLSearchParams(location.search).has('test');   // open with ?test to check in without being there
  const KIND_LABEL = { bench: 'Bench', table: 'Picnic table', toilet: 'Toilet' };
  const ICON_LIKE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
  const ICON_DISLIKE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>';

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wide = matchMedia('(min-width: 900px)');
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const colorOf = k => css(k === 'bench' ? '--bench' : k === 'table' ? '--table' : '--toilet');
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const km = r => r >= 1000 ? (r / 1000) + ' km' : r + ' m';

  const state = {
    phase: 'idle',          // idle | locating | loading | ready | error
    center: null, place: '', radius: SEARCH_RADIUS,
    spots: [], shown: PAGE, selected: null,
    mode: 'peek',           // peek | list | detail | raccoon | add
    rtab: 'raccoon', picking: false, pickSel: null,
    rateTab: 'lovely', votedList: [], pendingOpen: null, user: null, rateFor: null,
    sortBy: 'near', intro: 0,
    ckMsg: '', checking: false, reveal: null,
    pending: 0, failedN: 0,
    add: { kind: 'bench', backrest: '', rating: '', msg: '', near: null, done: null, busy: false, step: 'form', fix: null, pin: null },
    error: '',
    types: { bench: true, table: true, toilet: true },
    need: { liked: false, nice: false, sunset: false, water: false, green: false, quiet: false, visited: false },
    sunsetHidden: '',
  };
  let searchToken = 0;

  /* ---------- your history, saved on this device for now ----------
     Every check-in, vote, new pin and choice is one event with a time and coordinates.
     Totals, the raccoon, trinkets, streaks and stamps are all calculated from this history,
     so it can later be uploaded to the server exactly as it is. */
  let events = loadEvents();
  let me = deriveState(events);
  let links = { visits: new Map(), ratings: new Map(), notes: new Map() };

  function loadEvents() {
    try {
      const saved = JSON.parse(localStorage.getItem(EVENTS_KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) { /* fall through */ }
    return migrateOldData();
  }
  function saveEvents() {
    try { localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); } catch (e) { /* private mode: lasts for this visit */ }
  }
  function record(e) {
    events.push(e);
    saveEvents();
    me = deriveState(events);
    linkEvents();
    updateRaccoonButton();
    return e;
  }
  // Earlier versions saved votes, the raccoon and pins separately; turn them into history once.
  function migrateOldData() {
    const out = [];
    try {
      const g = JSON.parse(localStorage.getItem('pause.raccoon.v1') || 'null');
      const v = JSON.parse(localStorage.getItem('pause.votes.v1') || 'null');
      const pins = JSON.parse(localStorage.getItem('pause.added.v1') || 'null') || [];
      let counted = 0;
      if (g) {
        if (g.name) out.push({ type: 'profile', t: 0, name: g.name });
        const seen = new Set();
        for (const e of g.log || []) {
          if (e.added) continue;
          const vis = (g.visits || {})[e.id] || {};
          out.push({ type: 'checkin', t: e.t, spot: e.id, lat: vis.lat, lon: vis.lon, emoji: e.emoji, name: e.name, rare: !!e.rare,
            value: e.value || 0, first: !!e.first, where: e.where || '', place: null });
          counted += e.value || 0;
          seen.add(e.id);
        }
        for (const [id, vis] of Object.entries(g.visits || {})) {
          if (id.startsWith('user/') || seen.has(id)) continue;
          out.push({ type: 'checkin', t: vis.lastTs || 0, spot: id, lat: vis.lat, lon: vis.lon, value: 0, legacy: true, place: null });
        }
      }
      for (const p of pins) {
        out.push({ type: 'add', t: p.t, id: p.id, kind: p.kind, lat: p.lat, lon: p.lon, tags: p.tags || {}, value: GAME.addReward, place: null });
        counted += GAME.addReward;
      }
      if (g && (g.total || 0) > counted) out.push({ type: 'legacy', t: 0, value: g.total - counted });
      for (const [id, r] of Object.entries(v || {})) out.push({ type: 'vote', t: r.t || 0, spot: id, lat: r.lat, lon: r.lon, v: r.v });
    } catch (e) { /* start fresh */ }
    out.sort((x, y) => (x.t || 0) - (y.t || 0));
    return out;
  }

  const today = () => dayKey(new Date());
  const visitsOf = id => links.visits.get(id) || [];
  const myRating = id => { const e = links.ratings.get(id); return e ? e.rating : null; };
  // A spot's score: your own stars for now; the shared average once ratings are on the server.
  const scoreOf = id => { const r = myRating(id); return typeof r === 'number' ? r : null; };
  const toNum = v => (v === CLOSED ? CLOSED : Number(v));
  const myTags = id => (links.notes.get(id) || { tags: [] }).tags;
  // A sunset spot: water to the west, or someone (for now: you) tagged it Sunset.
  const isSunsetSpot = s => s.kind !== 'toilet' && (sunsetWater(s.m) || myTags(s.id).includes('sunset'));
  const hhmm = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  // Today's sunset here, or tomorrow's once today's has passed.
  function nextSunset() {
    const c = state.user || state.center;
    if (!c) return null;
    const now = new Date();
    const today = sunsetAt(now, c.lat, c.lon);
    if (today && today > now) return { at: today, day: 'today' };
    const tomorrow = sunsetAt(new Date(now.getTime() + 86400000), c.lat, c.lon);
    return tomorrow ? { at: tomorrow, day: 'tomorrow' } : null;
  }
  // For sorting by "best": your own stars where you've rated, otherwise the estimate from the surroundings.
  const bestScore = s => scoreOf(s.id) ?? s.estimate ?? 2.5;
  const promising = s => s.kind !== 'toilet' && myRating(s.id) == null && (s.estimate || 0) >= PROMISING_FROM;
  const visited = id => visitsOf(id).length > 0;
  const lastVisit = id => visitsOf(id).reduce((a, e) => (!a || e.t > a.t ? e : a), null);
  const canRerate = id => visitsOf(id).some(e => Date.now() - e.t <= GAME.rateWindowHours * 3600000);
  const look = () => raccoonById(me.raccoon);
  const petName = () => me.name || (me.raccoon ? look().name : 'your raccoon');

  // The raccoon is an optional companion; without it the app stays calm.
  const companionOn = () => me.companion === true;
  function updateRaccoonButton() {
    const b = $('#raccoonBtn');
    if (companionOn()) {
      b.innerHTML = `<span aria-hidden="true">🦝</span> ${me.total}`;
      b.setAttribute('aria-label', 'Your raccoon and your spots');
    } else {
      b.textContent = 'My spots';
      b.setAttribute('aria-label', 'Your rated spots and passport');
    }
  }

  function metres(lat1, lon1, lat2, lon2) {
    const k = Math.PI / 180, x = (lon2 - lon1) * k * Math.cos((lat1 + lat2) / 2 * k), y = (lat2 - lat1) * k;
    return Math.hypot(x, y) * 6371000;
  }

  /* ---------- map ---------- */
  const map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true })
    .setView([ZURICH.lat, ZURICH.lon], 15);
  if (wide.matches) L.control.zoom({ position: 'topright' }).addTo(map);
  L.control.attribution({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  const markerLayer = L.layerGroup().addTo(map);
  let areaCircle = null, userMarker = null;

  map.on('zoomend', () => renderMarkers());
  map.on('moveend', () => {
    if (!state.center || state.phase === 'loading') return;
    const c = map.getCenter();
    $('#searchHere').hidden = map.distance(c, [state.center.lat, state.center.lon]) < 300;
  });
  map.on('click', e => {
    if (state.mode === 'add' && state.add.step === 'place') {
      movePin(e.latlng.lat, e.latlng.lng);
      return;
    }
    if (state.mode !== 'peek') {
      state.selected = null;
      setMode('peek');
      renderMarkers();
    }
  });

  /* ---------- data ---------- */
  async function post(url, query, ms) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(query),
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error('replied ' + res.status);
      const json = await res.json();
      if (json.remark && /error|timed out|memory/i.test(json.remark)) throw new Error('ran out of time');
      return json;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('no answer in time');
      if (e instanceof TypeError) throw new Error('refused or busy');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  async function overpass(query) {
    const errors = [];
    for (const url of ENDPOINTS) {
      try {
        return await post(url, query, 50000);
      } catch (e) {
        errors.push(`${new URL(url).host} ${e.message}`);
      }
    }
    throw new Error(errors.join(', '));
  }

  function drawArea(center, radius) {
    if (areaCircle) areaCircle.remove();
    areaCircle = L.circle([center.lat, center.lon], {
      radius, color: css('--ink-3'), weight: 1, dashArray: '3 6', fill: false, interactive: false,
    }).addTo(map);
  }

  /* ---------- saved squares of map data ----------
     Data comes in squares of about 3.3 km. Squares are saved on the phone (IndexedDB),
     so moving around or reopening the app reuses them instead of loading again. */
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('pause', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('tiles');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    return {
      async get(k) {
        try {
          const db = await open();
          return await new Promise(res => {
            const q = db.transaction('tiles').objectStore('tiles').get(k);
            q.onsuccess = () => res(q.result || null);
            q.onerror = () => res(null);
          });
        } catch (e) { return null; }
      },
      async put(k, v) {
        try { (await open()).transaction('tiles', 'readwrite').objectStore('tiles').put(v, k); } catch (e) { /* storage full or blocked */ }
      },
    };
  })();

  const cache = new Map();   // recently used squares, kept in memory as well
  const failed = new Map();  // square → why it failed
  const CACHE_SIZE = 20;
  function remember(id, rec) {
    cache.delete(id);
    cache.set(id, rec);
    while (cache.size > CACHE_SIZE) {
      const old = [...cache.keys()].find(k => !currentNeed.includes(k));
      if (!old) break;
      cache.delete(old);
    }
  }
  let currentNeed = [];
  let queue = [], working = false, probeToken = 0;
  const fresh = rec => rec.ver === TILE_VERSION && Date.now() - rec.t < TILE_MAX_AGE_DAYS * 86400000;

  function enqueue(ids, urgent) {
    const list = ids.filter(id => !(cache.has(id) && fresh(cache.get(id))));
    queue = queue.filter(id => !list.includes(id));
    queue = urgent ? list.concat(queue) : queue.concat(list);
    pump();
  }

  async function pump() {
    if (working) return;
    working = true;
    while (queue.length) {
      const id = queue.shift();
      const needed = currentNeed.includes(id);
      const inMemory = cache.has(id);
      const saved = cache.get(id) || await idb.get(id);
      if (saved && fresh(saved)) {
        remember(id, saved);
        if (needed && !inMemory) refresh();
        continue;
      }
      try {
        const json = await overpass(buildTileQuery(tileBox(id)));
        const rec = { t: Date.now(), ver: TILE_VERSION, data: slimTile(json, tileBox(id)) };
        idb.put(id, rec);
        failed.delete(id);
        remember(id, rec);
        if (currentNeed.includes(id)) refresh();
      } catch (err) {
        failed.set(id, err.message);
        if (currentNeed.includes(id)) refresh();
      }
    }
    working = false;
  }

  function userElements() {
    return me.pins.map(a => ({
      type: 'user', id: a.id.split('/')[1], lat: a.lat, lon: a.lon,
      tags: Object.assign(a.kind === 'table' ? { leisure: 'picnic_table' } : { amenity: 'bench' }, a.tags || {}),
    }));
  }

  // Recompute the visible spots from whatever squares are available.
  function refresh() {
    const recs = currentNeed.map(id => cache.get(id)).filter(Boolean);
    state.pending = currentNeed.filter(id => !cache.has(id) && !failed.has(id)).length;
    state.failedN = currentNeed.filter(id => !cache.has(id) && failed.has(id)).length;
    if (!recs.length) {
      if (state.pending) { state.phase = 'loading'; render(); return; }
      showFailure();
      return;
    }
    const sections = mergeTiles(recs.map(r => r.data));
    sections.spots.push(...userElements());
    state.spots = analyseSections(sections, state.center, SEARCH_RADIUS);
    linkEvents();
    if (state.pendingOpen) {
      const p = state.pendingOpen;
      const hit = nearestSpot(p.lat, p.lon, 25);
      if (hit || !state.pending) {
        state.pendingOpen = null;
        if (hit) { state.selected = hit.id; state.mode = 'detail'; state.reveal = null; state.ckMsg = ''; }
      }
    }
    if (!placesQueued) {
      placesQueued = true;
      events.filter(e => (e.type === 'checkin' || e.type === 'add') && e.lat != null && !(e.place && e.place.v === 3)).slice(-15).forEach(queuePlace);
    }
    state.phase = 'ready';
    if (state.selected && !state.spots.some(s => s.id === state.selected)) {
      state.selected = null;
      if (state.mode === 'detail') state.mode = 'peek';
    }
    render();
  }

  // Visits and votes are saved with coordinates. Match each one to the spot it belongs to now,
  // so spots can be regrouped when the map changes without losing anything.
  let placesQueued = false;
  function linkEvents() {
    const visits = new Map(), ratingsBy = new Map(), notesBy = new Map();
    links = { visits, ratings: ratingsBy, notes: notesBy };
    if (!state.spots.length || !state.center) return;
    const memberOf = new Map();
    for (const s of state.spots) for (const mb of s.members) memberOf.set(mb.id, s);
    const seatSpots = state.spots.filter(s => s.kind !== 'toilet');
    const c = state.center, reach = SEARCH_RADIUS + 200;
    const near = (lat, lon) => {
      if (metres(lat, lon, c.lat, c.lon) > reach) return null;
      let best = null, bd = Infinity;
      for (const s of seatSpots) {
        for (const mb of s.members) {
          const d = metres(lat, lon, mb.lat, mb.lon);
          if (d < bd) { bd = d; best = s; }
        }
      }
      return bd <= GROUP_RADIUS ? best : null;
    };
    const spotOf = e => memberOf.get(e.spot || e.id) || (e.lat != null ? near(e.lat, e.lon) : null);
    let repaired = false;
    for (const e of me.visits) {
      const s = spotOf(e);
      if (!s) continue;
      // Some early check-ins were saved without coordinates, so they couldn't get a stamp.
      // Their spot is loaded now, so fill them in and look up the place.
      if (e.lat == null) {
        e.lat = +s.lat.toFixed(6);
        e.lon = +s.lon.toFixed(6);
        repaired = true;
        queuePlace(e);
      }
      if (!visits.has(s.id)) visits.set(s.id, []);
      visits.get(s.id).push(e);
    }
    for (const e of me.ratings) {
      const s = spotOf(e);
      if (!s) continue;
      const cur = ratingsBy.get(s.id);
      if (!cur || e.t >= cur.t) ratingsBy.set(s.id, e);
    }
    for (const e of me.notes) {
      const s = spotOf(e);
      if (!s) continue;
      const cur = notesBy.get(s.id);
      if (!cur || e.t >= cur.t) notesBy.set(s.id, e);
    }
    if (repaired) saveEvents();
  }

  function nearestSpot(lat, lon, within) {
    let best = null, bd = Infinity;
    for (const s of state.spots) {
      for (const mb of s.members) {
        const d = metres(lat, lon, mb.lat, mb.lon);
        if (d < bd) { bd = d; best = s; }
      }
    }
    return bd <= within ? best : null;
  }

  /* ---------- passport places ----------
     After each check-in, OpenStreetMap is asked which town (or city district) and country
     the spot is in. Offline check-ins are looked up the next time the app opens. */
  const placeQueue = [];
  let placeBusy = false;
  function queuePlace(ev) {
    if (ev && ev.lat != null && ev.kind !== 'toilet' && !(ev.place && ev.place.v === 3)) { placeQueue.push(ev); pumpPlaces(); }
  }
  // Saves the whole chain (country, town, district, neighbourhood). Which one a stamp shows
  // is decided when it's drawn, so the rule can change later without asking again.
  async function lookupPlace(lat, lon) {
    const json = await overpass(`[out:json][timeout:20];is_in(${lat},${lon})->.a;area.a["boundary"="administrative"]["admin_level"];out tags;`);
    const areas = (json.elements || []).filter(e => e.tags && e.tags.admin_level);
    const lvl = n => areas.find(a => a.tags.admin_level === String(n));
    const country = lvl(2);
    const town = lvl(8) || lvl(7) || lvl(6);
    const inTown = town && (town === lvl(8) || town === lvl(7));
    const l9 = inTown ? lvl(9) : null, l10 = inTown ? lvl(10) : null;
    if (!town && !country) throw new Error('no place found');
    const cname = country ? (country.tags['name:en'] || country.tags.name) : 'Somewhere';
    return {
      v: 3,
      townArea: town ? town.id : null,
      country: cname,
      code: country ? (country.tags['ISO3166-1:alpha2'] || country.tags['ISO3166-1'] || '') : '',
      town: town ? town.tags.name : cname,
      district: l9 ? l9.tags.name : '',
      neighbourhood: l10 ? l10.tags.name : '',
    };
  }
  async function pumpPlaces() {
    if (placeBusy) return;
    placeBusy = true;
    while (placeQueue.length) {
      const ev = placeQueue.shift();
      if (ev.place && ev.place.v === 3) continue;
      try {
        ev.place = await lookupPlace(ev.lat, ev.lon);
        saveEvents();
        countSubareas(ev.place);
        me = deriveState(events);
        linkEvents();
        placeResolved(ev);
      } catch (e) { /* stays empty and is tried again next time */ }
    }
    placeBusy = false;
  }
  // How many neighbourhoods (or districts) a town has, asked once per town and kept on the phone.
  const SUBAREA_KEY = 'benchbandit.subareas.v1';
  let subareas = {};
  try { subareas = JSON.parse(localStorage.getItem(SUBAREA_KEY)) || {}; } catch (e) { subareas = {}; }
  const subLevel = place => (placeParts(place).sub ? (placeParts(place).sub === place.neighbourhood ? 10 : 9) : null);
  function subareaInfo(country, town) {
    const hit = Object.values(subareas).find(x => x.country === country && x.town === town);
    return hit || null;
  }
  async function countSubareas(place) {
    const level = subLevel(place);
    if (!level || !place.townArea) return;
    const key = place.townArea + ':' + level;
    if (subareas[key]) return;
    try {
      const json = await overpass(`[out:json][timeout:25];area(${place.townArea})->.t;rel(area.t)["boundary"="administrative"]["admin_level"="${level}"];out tags;`);
      const names = new Set((json.elements || []).map(e => e.tags && e.tags.name).filter(Boolean));
      subareas[key] = { country: place.country, town: place.town, level, count: names.size, t: Date.now() };
      try { localStorage.setItem(SUBAREA_KEY, JSON.stringify(subareas)); } catch (e) { /* ignore */ }
      if (state.mode === 'raccoon') renderPanel();
    } catch (e) { /* try again another time */ }
  }

  function placeResolved(ev) {
    const label = stampLabel(ev.place);
    const isNew = !me.visits.some(e => e !== ev && e.place && stampLabel(e.place) === label && e.t <= ev.t);
    if (state.reveal && state.reveal.t === ev.t) state.reveal.stamp = { label, isNew };
    if (state.mode === 'detail' || state.mode === 'raccoon') renderPanel();
  }

  async function showFailure() {
    const token = ++probeToken;
    state.phase = 'loading';
    render();
    let reachable = false;
    try {
      await post(ENDPOINTS[0], '[out:json][timeout:10];node(1);out ids;', 15000);
      reachable = true;
    } catch (e) { /* stays false */ }
    if (token !== probeToken) return;
    const why = reachable
      ? 'The data server is reachable but couldn’t finish loading this area, most likely because it’s busy. Try again in a minute.'
      : location.protocol === 'file:'
        ? 'The data servers refused the request. The page is open as a local file, which they may reject, so open it through your GitHub Pages link instead.'
        : 'The data servers couldn’t be reached. They may be overloaded, or this network may block them. Try again in a minute or on another connection.';
    const detail = [...new Set(currentNeed.map(id => failed.get(id)).filter(Boolean))].join(', ');
    state.phase = 'error';
    state.error = `<p>${why}</p><p class="detail-line">${esc(detail)}</p>`;
    if (!wide.matches) state.mode = 'list';
    render();
  }

  // Show spots within 1.5 km of a point, using saved squares where possible,
  // and quietly load the rest of the 5 km surroundings in the background.
  async function showAround(center, place) {
    probeToken++;
    Object.assign(state, { center, place, shown: PAGE, error: '' });
    if (state.mode === 'detail') { state.selected = null; state.mode = 'peek'; }
    $('#searchHere').hidden = true;
    drawArea(center, SEARCH_RADIUS);
    const need = tilesForCircle(center, SEARCH_RADIUS + 450);
    currentNeed = need;
    await Promise.all(need.filter(id => !cache.has(id)).map(async id => {
      const rec = await idb.get(id);
      if (rec && currentNeed.includes(id)) remember(id, rec);
    }));
    if (currentNeed !== need) return;
    need.forEach(id => failed.delete(id));
    refresh();
    enqueue(need.filter(id => !cache.has(id)), true);
    const later = tilesForCircle(center, FETCH_RADIUS).filter(id => !need.includes(id))
      .concat(need.filter(id => cache.has(id) && !fresh(cache.get(id))));
    enqueue(later, false);
  }

  /* ---------- filtering ---------- */
  function passes(s) {
    if (s.kind === 'toilet' ? !state.types.toilet : !((state.types.bench && s.hasBench) || (state.types.table && s.hasTable))) return false;
    const n = state.need;
    if (n.liked && !isLovely(scoreOf(s.id))) return false;
    if (n.nice && !isNice(scoreOf(s.id))) return false;
    if (n.sunset && !isSunsetSpot(s)) return false;
    if (n.visited && !visited(s.id)) return false;
    if (n.water && !s.flags.water) return false;
    if (n.green && !s.flags.green) return false;
    if (n.quiet && !s.flags.quiet) return false;
    return true;
  }
  const visible = () => {
    const v = state.spots.filter(passes);
    if (state.sortBy === 'best') v.sort((a, b) => bestScore(b) - bestScore(a) || a.dist - b.dist);
    return v;
  };
  const selectedSpot = () => state.spots.find(s => s.id === state.selected) || null;

  /* ---------- rendering ---------- */
  function render() {
    renderFilters();
    renderMarkers();
    renderPanel();
  }

  function renderFilters() {
    document.querySelectorAll('.chip.type').forEach(btn => {
      const k = btn.dataset.type;
      btn.setAttribute('aria-pressed', String(state.types[k]));
      btn.querySelector('.count').textContent =
        state.phase === 'ready' ? state.spots.filter(s => (k === 'toilet' ? s.kind === 'toilet' : k === 'bench' ? s.hasBench : s.hasTable)).length : '';
    });
    document.querySelectorAll('.chip.need').forEach(btn => {
      btn.setAttribute('aria-pressed', String(state.need[btn.dataset.need]));
    });
  }

  // Zoomed out, nearby spots merge into a bubble with a count. Liked and selected
  // spots always stay visible on their own.
  const CLUSTER_MAX_ZOOM = 16, CLUSTER_CELL = 40;
  function renderMarkers() {
    markerLayer.clearLayers();
    if (state.phase !== 'ready') return;
    const ink = css('--ink'), paper = css('--paper'), like = css('--like');
    const z = map.getZoom();
    const solo = [], cells = new Map();
    for (const s of visible()) {
      if (z > CLUSTER_MAX_ZOOM || s.id === state.selected || isLovely(scoreOf(s.id))) { solo.push(s); continue; }
      const p = map.project([s.lat, s.lon], z);
      const key = Math.floor(p.x / CLUSTER_CELL) + ',' + Math.floor(p.y / CLUSTER_CELL);
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(s);
    }
    for (const group of cells.values()) {
      if (group.length === 1) { solo.push(group[0]); continue; }
      const lat = group.reduce((n, s) => n + s.lat, 0) / group.length;
      const lon = group.reduce((n, s) => n + s.lon, 0) / group.length;
      const size = group.length < 10 ? 28 : group.length < 50 ? 34 : 40;
      L.marker([lat, lon], {
        icon: L.divIcon({ className: 'bubble-wrap', html: `<div class="bubble">${group.length}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }),
        title: `${group.length} spots, tap to zoom in`,
      }).on('click', () => {
        map.fitBounds(L.latLngBounds(group.map(s => [s.lat, s.lon])).pad(0.4), { maxZoom: CLUSTER_MAX_ZOOM + 2, animate: !reduceMotion });
      }).addTo(markerLayer);
    }
    // Draw order puts liked and selected pins on top.
    const rank = s => (s.id === state.selected ? 3 : isLovely(scoreOf(s.id)) ? 2 : isLow(myRating(s.id)) ? 0 : 1);
    solo.sort((a, b) => rank(a) - rank(b));
    for (const s of solo) {
      const sel = s.id === state.selected, v = isLovely(scoreOf(s.id)) ? 1 : isLow(myRating(s.id)) ? -1 : 0;
      const group = s.members.length > 1;
      L.circleMarker([s.lat, s.lon], {
        radius: sel ? 10 : v === 1 ? 8 : v === -1 ? 5 : group ? 7 : 6,
        color: sel ? ink : v === 1 ? like : s.added ? ink : promising(s) ? '#E0A526' : paper,
        weight: sel || v === 1 ? 3 : s.added || promising(s) ? 2.5 : 1.5,
        fillColor: colorOf(s.kind),
        fillOpacity: v === -1 && !sel ? 0.35 : 0.95,
        dashArray: s.added && !sel && v !== 1 ? '3 3' : null,
        bubblingMouseEvents: false,
      }).on('click', () => openSpot(s.id)).addTo(markerLayer);
    }
  }

  function statusText() {
    switch (state.phase) {
      case 'idle': return '';
      case 'locating': return 'Finding your location…';
      case 'loading': return `Loading spots around ${state.place}. The first time can take up to 30 seconds; after that the area is saved on your phone.`;
      case 'error': return 'Couldn’t load data from OpenStreetMap.';
    }
    const v = visible(), total = state.spots.length;
    let text;
    if (!total) text = `Nothing mapped within ${km(SEARCH_RADIUS)} of ${state.place}.`;
    else if (!v.length) text = 'No spots match these filters.';
    else {
      const lovely = v.filter(s => isLovely(scoreOf(s.id))).length;
      text = `${v.length} ${v.length === 1 ? 'spot' : 'spots'} within ${km(SEARCH_RADIUS)} of ${state.place}${lovely ? `, ${lovely} lovely` : ''}.`;
    }
    if (state.pending) text += ' Still loading part of the area…';
    else if (state.failedN) text += ' Part of the area couldn’t load.';
    else if (state.place === 'Zurich centre') text += ' Tap Locate me to search around you.';
    if (state.need.sunset) {
      const ns = nextSunset();
      if (ns) text += ` Sunset ${ns.day} at ${hhmm(ns.at)}.`;
    }
    return text;
  }

  // "Sunset at 18:24. 3 sunset spots nearby." Shown in the hour and a half before sunset.
  function renderSunsetBanner() {
    const box = $('#sunsetBanner');
    const ns = nextSunset();
    const mins = ns && ns.day === 'today' ? (ns.at - Date.now()) / 60000 : Infinity;
    const count = state.phase === 'ready' ? state.spots.filter(isSunsetSpot).length : 0;
    if (!(mins <= 90 && count && !state.need.sunset && state.sunsetHidden !== dayKey(new Date()))) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<span class="sun" aria-hidden="true">☀</span>
      <span class="sunset-text">Sunset at ${hhmm(ns.at)}. ${count} sunset ${count === 1 ? 'spot' : 'spots'} within ${km(SEARCH_RADIUS)}.</span>
      <button type="button" class="sunset-go" data-sun="show">Show</button>
      <button type="button" class="sunset-x" data-sun="hide" aria-label="Hide for today">×</button>`;
  }

  function renderPanel() {
    const panel = $('#panel');
    panel.dataset.mode = state.mode;
    $('#status').textContent = statusText();
    renderSunsetBanner();
    const toggle = $('#panelToggle');
    toggle.textContent = state.mode === 'peek' ? 'Show list' : state.mode === 'list' ? 'Hide list' : 'Close';
    if (state.mode === 'raccoon' || state.mode === 'add') {
      toggle.hidden = false;
      $('#panelBody').innerHTML = state.mode === 'raccoon' ? raccoonHTML() : addHTML();
      return;
    }
    toggle.hidden = state.phase === 'idle' || state.phase === 'locating';

    let html = '';
    const sel = selectedSpot();
    if (state.phase === 'error') {
      html = `<div class="message">${state.error}<button class="pill" type="button" data-act="retry">Try again</button></div>`;
    } else if (state.phase !== 'ready') {
      html = state.phase === 'locating'
        ? '<div class="message"><p>Allow location access to see spots around you. Without it, the map starts at Zurich centre.</p></div>'
        : '<div class="message"><p>Reading OpenStreetMap. Busy areas can take up to 30 seconds.</p></div>';
    } else if (state.mode === 'detail' && sel) {
      html = detailHTML(sel);
    } else {
      html = listHTML();
    }
    $('#panelBody').innerHTML = html;
  }

  function factsHTML(list, warn) {
    if (!list.length) return '';
    return `<span class="facts${warn ? ' warn' : ''}">${list.map(f =>
      `<span class="fact">${esc(f.label)} <span class="d">${fmtDist(f.d)}</span></span>`).join('')}</span>`;
  }

  function summaryHTML(tx, big) {
    return `<span class="sentence${big ? ' big' : ''}">${esc(tx.sentence)}</span>
      ${tx.comfort ? `<span class="comfort">${esc(tx.comfort)}</span>` : ''}
      ${tx.note ? `<span class="comfort quiet">${esc(tx.note)}</span>` : ''}
      ${factsHTML(tx.facts, false)}
      ${factsHTML(tx.warnings, true)}`;
  }

  function listHTML() {
    const v = visible();
    if (!state.spots.length) {
      return '<div class="message"><p>Move the map somewhere else and tap Search this area.</p></div>';
    }
    if (!v.length) {
      return '<div class="message"><p>No spots match these filters. Turn one off to see more.</p></div>';
    }
    const sorter = `<div class="seg sorter" role="group" aria-label="Sort">
        <button class="segbtn" type="button" data-act="sort" data-v="near" aria-pressed="${state.sortBy === 'near'}">Nearest</button>
        <button class="segbtn" type="button" data-act="sort" data-v="best" aria-pressed="${state.sortBy === 'best'}">Best</button>
      </div>`;
    const items = v.slice(0, state.shown).map(s => {
      return `<li class="spot${isLow(myRating(s.id)) ? ' disliked' : ''}">
        <button class="spot-head" type="button" data-act="open" data-id="${esc(s.id)}">
          <span class="dot" style="--c:${colorOf(s.kind)}" aria-hidden="true"></span>
          <span class="spot-body">${summaryHTML(s.text, false)}</span>
          <span class="dist">${fmtDist(s.dist)}${visitTag(s)}</span>
        </button>
      </li>`;
    }).join('');
    const rest = v.length - state.shown;
    const more = rest > 0 ? `<button class="pill more" type="button" data-act="more">Show ${Math.min(PAGE, rest)} more</button>` : '';
    return `${sorter}<ul class="list">${items}</ul>${more}
      <p class="note">Descriptions are estimated from OpenStreetMap data, so something missing from the map may still exist in real life.</p>`;
  }

  function visitTag(s) {
    const r = myRating(s.id);
    if (r === CLOSED) return '<span class="tag low">Closed</span>';
    if (r) return `<span class="tag ${isLovely(r) ? 'lovely' : isNice(r) ? 'nice' : isLow(r) ? 'low' : ''}">${r}★ ${esc(ratingWord(r, s.kind))}</span>`;
    if (visited(s.id)) return '<span class="tag">Visited</span>';
    return promising(s) ? '<span class="tag promising">Looks promising</span>' : '';
  }

  function checkinHTML(s) {
    const toilet = s.kind === 'toilet';
    const r = state.reveal && state.reveal.id === s.id ? state.reveal : null;
    const rated = myRating(s.id);
    const been = visited(s.id);
    if (r && r.revisit) {
      return `<div class="checkin"><p class="ck-lead">Saved: ${esc(ratedText(r.rating, s.kind))}. Thanks for keeping it up to date.</p></div>`;
    }
    if (r && !companionOn()) {
      const lines = [r.rating === CLOSED ? 'You marked it closed or locked.' : `You gave it ${ratedText(r.rating, s.kind)}.`];
      if (r.stamp) lines.push(r.stamp.isNew ? `New passport stamp: ${r.stamp.label}.` : `Stamped in ${r.stamp.label}.`);
      return `<div class="checkin">
        <div class="reveal"><span class="snack calm" aria-hidden="true">★</span>
          <span class="reveal-text"><strong>Thanks for rating!</strong>${lines.map(l => `<span>${esc(l)}</span>`).join('')}</span>
        </div>
        ${!toilet && typeof r.rating === 'number' && r.rating >= 4 ? '<div class="actions"><button type="button" class="plain" data-act="shareSpot">Share this spot</button></div>' : ''}
        ${me.companion === null ? offerHTML() : ''}
      </div>`;
    }
    if (r) {
      const name = (r.snack.rare ? 'golden ' : '') + r.snack.name;
      const lines = [r.rating === CLOSED ? 'You marked it closed or locked.' : `You gave it ${ratedText(r.rating, s.kind)}.`];
      if (toilet) lines.push(`${cap(petName())} waited politely outside.`);
      if (r.snack.rare) lines.push(`Rare find! It counts as ${GAME.rareValue} snacks.`);
      if (r.streakBonus) lines.push('Your weekly streak continues: one extra snack.');
      lines.push(`${cap(petName())} has now eaten ${me.total}.`);
      if (r.stamp) lines.push(r.stamp.isNew ? `New passport stamp: ${r.stamp.label}.` : `Stamped in ${r.stamp.label}.`);
      const trinket = r.trinket ? TRINKETS.find(t => t.id === r.trinket) : null;
      return `<div class="checkin${r.snack.rare || trinket ? ' rare' : ''}">
        <div class="reveal"><span class="snack" aria-hidden="true">${r.snack.emoji}</span>
          <span class="reveal-text"><strong>${esc(cap(name))} for ${esc(petName())}!</strong>${lines.map(l => `<span>${esc(l)}</span>`).join('')}</span>
        </div>
        ${trinket ? `<p class="found"><span aria-hidden="true">✨</span> ${esc(cap(petName()))} found a trinket: ${esc(trinket.name)}! <button class="link-btn" type="button" data-act="openWardrobe">Put it on</button></p>` : ''}
        ${bubble(voiceOf(me.raccoon, r.snack.rare ? 'golden' : trinket ? 'trinket' : isLovely(r.rating) ? 'lovely' : isLow(r.rating) ? 'low' : 'happy'))}
        ${!toilet && typeof r.rating === 'number' && r.rating >= 4 ? '<div class="actions"><button type="button" class="plain" data-act="shareSpot">Share this spot</button></div>' : ''}
        ${!me.raccoon ? '<p class="found">Your raccoon doesn’t have a face yet. <button class="link-btn" type="button" data-act="openRaccoon">Choose one</button></p>' : ''}
      </div>`;
    }
    if (state.rateFor === s.id) {
      const q = been && rated ? stillQuestion(rated) : toilet ? 'How is this toilet?' : 'How is this spot?';
      return `<div class="checkin">
        <p class="ck-lead rate-q">${esc(q)}</p>
        ${starsRow(s.kind, been ? rated : null, 'rate', false)}
        <p class="ck-msg">${been
          ? (companionOn() ? 'Snacks are only for new spots, but an up-to-date rating helps everyone find the best ones.' : 'An up-to-date rating helps everyone find the best spots.')
          : (companionOn() ? `Rate it and ${esc(petName())} gets a snack.` : 'Your rating helps others find the best places to sit.')}</p>
      </div>`;
    }
    const last = lastVisit(s.id);
    const when = last ? new Date(last.t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) : '';
    const lead = !been ? (toilet
        ? (companionOn() ? 'Rate this toilet to help others, and your raccoon gets a snack while it waits outside.' : 'Rate this toilet to help others find a good one.')
        : (companionOn() ? 'A snack is waiting for your first rating here.' : 'You haven’t rated this spot yet.'))
      : rated === CLOSED ? `You marked this toilet closed on ${when}. Check in again if it has reopened.`
      : rated ? `You gave this ${toilet ? 'toilet' : 'spot'} ${starText(rated)} (${ratingWord(rated, s.kind).toLowerCase()}) on ${when}. Check in again if something has changed.`
      : 'You’ve been here before. Check in to rate it.';
    return `<div class="checkin">
      <p class="ck-lead">${esc(lead)}</p>
      <button class="ck-btn" type="button" data-act="checkin"${state.checking ? ' disabled' : ''}>${state.checking ? 'Checking your location…' : been && rated ? 'Check in and update' : 'Check in and rate'}</button>
      <p class="ck-msg">${esc(state.ckMsg || (TEST ? 'Test mode: your location isn’t checked.' : `Works within ${GAME.checkinRadius} m of the spot.`))}</p>
    </div>`;
  }

  // "4 stars, nice" or "closed or locked"
  function ratedText(r, kind) {
    return r === CLOSED ? 'closed or locked' : `${starText(r)}, ${ratingWord(r, kind).toLowerCase()}`;
  }

  // Five stars, each with its word underneath, so people see what a grade means before tapping.
  function starsRow(kind, current, act, small) {
    const cur = typeof current === 'number' ? current : 0;
    let html = `<div class="stars${small ? ' small' : ''}" role="group" aria-label="Your rating">` +
      starWords(kind).map((w, i) => {
        const n = i + 1;
        return `<button class="star${n <= cur ? ' on' : ''}" type="button" data-act="${act}" data-v="${n}" aria-pressed="${cur === n}" aria-label="${starText(n)}: ${esc(w)}">
          <span class="glyph" aria-hidden="true">★</span><span class="word">${esc(w)}</span></button>`;
      }).join('') + '</div>';
    if (kind === 'toilet') html += `<button class="closedbtn" type="button" data-act="${act}" data-v="${CLOSED}" aria-pressed="${current === CLOSED}">Closed or locked</button>`;
    return html;
  }

  // "What's good here?" One optional tap per tag, for a day after checking in.
  function tagsHTML(s) {
    if (s.kind === 'toilet' || myRating(s.id) == null || !canRerate(s.id) || state.rateFor === s.id) return '';
    const mine = myTags(s.id);
    return `<div class="rerate">
      <p class="field-label">What’s good here?</p>
      <div class="tagchips">${SPOT_TAGS.map(([k, l]) => `<button class="chip need" type="button" data-act="tag" data-v="${k}" aria-pressed="${mine.includes(k)}">${l}</button>`).join('')}</div>
    </div>`;
  }

  // Offered once, after the first rating.
  function offerHTML() {
    return `<div class="offer">
      <p class="offer-title">Want some company?</p>
      <p class="fine">A raccoon can come along and collect crumbs from every new spot you rate. It grows rounder, finds trinkets, and has opinions about benches.</p>
      <div class="actions"><button type="button" class="go" data-act="companionYes">Bring a raccoon</button><button type="button" class="plain" data-act="companionNo">No thanks</button></div>
    </div>`;
  }

  // A line from your raccoon, in its own voice.
  function bubble(text) {
    if (!text || !me.raccoon || !companionOn()) return '';
    return `<div class="bubble-line"><span class="bubble-face" aria-hidden="true">${raccoonSVG({ look: look(), mood: 'happy', viewBox: '58 30 104 84' })}</span><p class="speech">${esc(text)}</p></div>`;
  }

  // For a day after checking in, the rating can still be changed (for a mis-tap).
  function rerateHTML(s) {
    const r = myRating(s.id);
    if (!r || !canRerate(s.id) || state.rateFor === s.id) return '';
    return `<div class="rerate">
      <p class="field-label">Your rating</p>
      ${starsRow(s.kind, r, 'rerate', true)}
      <p class="fine">You can change it for ${GAME.rateWindowHours} hours after checking in.</p>
    </div>`;
  }

  /* ---------- raccoon panel: raccoon, wardrobe, passport ---------- */
  function raccoonHTML() {
    if (companionOn() && (!me.raccoon || state.picking)) return pickHTML();
    const tabs = companionOn()
      ? [['raccoon', 'Raccoon'], ['wardrobe', 'Wardrobe'], ['passport', 'Passport'], ['rated', 'Rated']]
      : [['rated', 'Rated'], ['passport', 'Passport']];
    if (!tabs.some(t => t[0] === state.rtab)) state.rtab = tabs[0][0];
    const body = state.rtab === 'wardrobe' ? wardrobeHTML() : state.rtab === 'passport' ? passportHTML()
      : state.rtab === 'rated' ? ratedHTML() : raccoonTabHTML();
    return `<div class="detail">
      <div class="detail-nav"><button class="link-btn" type="button" data-act="back">Back to list</button></div>
      <div class="tabs" role="tablist" aria-label="Your spots">${tabs.map(([k, l]) =>
        `<button type="button" role="tab" class="tab" data-act="rtab" data-v="${k}" aria-selected="${state.rtab === k}">${l}</button>`).join('')}</div>
      ${body}
      <div class="settings">
        <p class="rc-section">Settings</p>
        <div class="setting-row"><span>Raccoon companion</span>
          <button type="button" class="toggle" data-act="companion" aria-pressed="${companionOn()}">${companionOn() ? 'On' : 'Off'}</button></div>
        <div class="actions reset"><button type="button" class="plain" data-act="showIntro">Show the intro again</button><button type="button" class="plain" data-act="reset">Start fresh</button></div>
        <p class="fine">Start fresh clears your ratings, pins and stamps${companionOn() ? ', and your raccoon,' : ''} on this phone.</p>
      </div>
    </div>`;
  }

  function art() {
    const st = stageOf(me.total), mood = moodOf(me.lastFed, Date.now());
    const last = me.visits.filter(e => e.emoji).sort((a, b) => b.t - a.t)[0];
    return raccoonSVG({ scale: st.scale, mood: mood.key, holding: mood.key === 'happy' && last ? last.emoji : '', look: look(), worn: me.worn });
  }

  function raccoonTabHTML() {
    const now = Date.now();
    const st = stageOf(me.total), mood = moodOf(me.lastFed, now);
    const spots = new Set(me.visits.map(e => e.spot || e.id)).size;
    const progress = st.next ? `${st.toNext} more ${st.toNext === 1 ? 'snack' : 'snacks'} until it’s ${st.next.label.toLowerCase()}.` : 'As round as a raccoon gets.';
    const streak = streakOf(me.newSpots, now);
    const streakLine = streak.weeks
      ? `${streak.weeks}-week streak. ${streak.thisWeek ? 'This week already counts.' : 'Rate a new spot this week to keep it going and get an extra snack.'}`
      : 'Rate at least one new spot a week to build a weekly streak.';
    const when = t => {
      const d = Math.round((new Date(now).setHours(0, 0, 0, 0) - new Date(t).setHours(0, 0, 0, 0)) / 86400000);
      return d === 0 ? 'Today' : d === 1 ? 'Yesterday' : new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    };
    const recent = me.visits.filter(e => e.value > 0).sort((a, b) => b.t - a.t).slice(0, 15);
    const log = recent.length
      ? `<ul class="log">${recent.map(e => {
          const added = e.type === 'add';
          const label = added ? (e.kind === 'table' ? 'New picnic table' : 'New bench') : cap((e.rare ? 'golden ' : '') + e.name);
          const trinket = e.trinket ? TRINKETS.find(t => t.id === e.trinket) : null;
          return `<li class="${e.rare ? 'rare' : ''}">
            <span class="em" aria-hidden="true">${added ? '📍' : e.emoji}</span>
            <span class="what">${esc(label)}${trinket ? ` and a ${esc(trinket.name)}` : ''}<span class="where">${esc(added ? 'Added by you' : e.where || '')}</span></span>
            <span class="val">+${e.value}<small>${when(e.t)}</small></span>
          </li>`;
        }).join('')}</ul>`
      : '<p class="fine">No snacks yet. Find a bench, check in, and your raccoon gets its first meal.</p>';
    return `${bubble(voiceOf(me.raccoon, mood.key === 'hungry' || mood.key === 'peckish' ? 'hungry' : 'happy'))}
      <div class="raccoon-art">${art()}</div>
      <div class="rc-head"><h2 class="rc-name">${esc(cap(petName()))}</h2><button class="link-btn" type="button" data-act="rename">Rename</button></div>
      <p class="rc-line">${esc(st.label)}. ${esc(mood.label)}.</p>
      <p class="rc-line quiet">${me.total} ${me.total === 1 ? 'snack' : 'snacks'} eaten at ${spots} ${spots === 1 ? 'spot' : 'spots'}${me.rares ? `, ${me.rares} golden` : ''}. ${progress}</p>
      <p class="rc-line quiet">${esc(streakLine)}</p>
      <p class="rc-line"><button class="link-btn" type="button" data-act="openPick">Switch raccoon</button> <button class="link-btn" type="button" data-act="shareRaccoon">Share</button></p>
      <p class="rc-section">Recent snacks</p>
      ${log}
      <p class="fine">Check in within ${GAME.checkinRadius} m of a spot and rate it. The first time you rate a spot, your raccoon gets ${GAME.newSpotValue} snacks, and ${GAME.toiletValue} for a toilet. About 1 in ${GAME.rareOneIn} is golden and counts as ${GAME.rareValue}, and about 1 in ${GAME.trinketOneIn} new spots hides a trinket. Coming back lets you update your rating, without a snack, so the best spots stay up to date.${TEST ? ' Test mode is on, so your location isn’t checked.' : ''}</p>
`;
  }

  function wardrobeHTML() {
    const found = me.trinkets.length;
    const slots = SLOTS.map(([slot, label]) => `<p class="rc-section">${label}</p>
      <div class="tiles">${TRINKETS.filter(t => t.slot === slot).map(t => me.trinkets.includes(t.id)
        ? `<button class="tile" type="button" data-act="wear" data-slot="${slot}" data-v="${t.id}" aria-pressed="${me.worn[slot] === t.id}">${trinketTileSVG(t.id, look())}<span>${esc(cap(t.name))}</span></button>`
        : '<div class="tile locked"><span class="q" aria-hidden="true">?</span><span>Not found yet</span></div>').join('')}</div>`).join('');
    return `<div class="raccoon-art small">${art()}</div>
      <p class="rc-line quiet">${found} of ${TRINKETS.length} trinkets found. About 1 in ${GAME.trinketOneIn} new spots hides one you don’t have yet. Tap a trinket to put it on or take it off.</p>
      ${slots}`;
  }

  function passportHTML() {
    const pp = passportOf(me.visits);
    const stamps = pp.reduce((n, c) => n + c.stamps.length, 0);
    const seats = me.visits.filter(e => e.kind !== 'toilet');
    const pending = seats.filter(e => !e.place && e.lat != null).length;
    const unplaced = seats.filter(e => e.lat == null).length;
    const checkins = seats.length;
    const spots = new Set(seats.map(e => e.spot || e.id)).size;
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    const summary = stamps
      ? `${plural(stamps, 'stamp', 'stamps')} from ${plural(checkins, 'check-in', 'check-ins')} at ${plural(spots, 'spot', 'spots')}. Stamps come from check-ins, not votes, and each one covers a whole neighbourhood or town, so several spots can share a stamp.`
      : 'No stamps yet. Every neighbourhood or town you check in at adds one.';
    const notes = [];
    if (pending) notes.push(`${plural(pending, 'stamp is', 'stamps are')} still being looked up and will appear when your phone is online.`);
    if (unplaced) notes.push(`${plural(unplaced, 'early check-in has', 'early check-ins have')} no saved location yet and will get ${unplaced === 1 ? 'its stamp' : 'their stamps'} next time that area is on the map.`);
    return `<p class="rc-line quiet passport-intro">${esc(summary)}${notes.length ? ' ' + esc(notes.join(' ')) : ''}</p>
      ${pp.map(c => `<p class="rc-section">${esc(c.country)}</p>
        ${progressHTML(c)}
        <div class="stamps">${c.stamps.map((st, i) => `<div class="stamp">${stampSVG(st, 'st' + hash32(c.country + st.label) + '_' + i)}</div>`).join('')}</div>`).join('')}
      ${seats.length ? '<div class="actions"><button type="button" class="go" data-act="showVisited">Show my spots on the map</button></div>' : ''}`;
  }

  // One entry per rated spot, everywhere, using your latest rating of it.
  function ratedEntries() {
    const entries = [];
    for (const e of me.ratings.slice().sort((a, b) => a.t - b.t)) {
      if (e.lat == null || e.kind === 'toilet') continue;
      const key = e.spot || e.id;
      let hit = entries.find(x => x.keys.has(key) || metres(x.lat, x.lon, e.lat, e.lon) <= GROUP_RADIUS);
      if (!hit) { hit = { keys: new Set(), lat: e.lat, lon: e.lon, last: e }; entries.push(hit); }
      hit.keys.add(key);
      if (e.t >= hit.last.t) { hit.last = e; hit.lat = e.lat; hit.lon = e.lon; }
    }
    return entries;
  }

  function ratedHTML() {
    const want = state.rateTab;
    const band = r => (r === 5 ? 'lovely' : r === 4 ? 'nice' : 'other');
    const ref = state.user || state.center;
    const all = ratedEntries();
    const count = k => all.filter(x => band(x.last.rating) === k).length;
    const list = all.filter(x => band(x.last.rating) === want).map(x => {
      const live = state.spots.find(s => s.members.some(mb => x.keys.has(mb.id))) || nearestSpot(x.lat, x.lon, GROUP_RADIUS);
      const visit = me.visits.filter(e => e.place && (x.keys.has(e.spot || e.id) || (e.lat != null && metres(e.lat, e.lon, x.lat, x.lon) <= 25)))
        .sort((a, b) => b.t - a.t)[0];
      return {
        lat: x.lat, lon: x.lon, live,
        kind: live ? live.kind : x.last.kind || 'bench',
        stars: x.last.rating,
        text: live ? live.text.sentence : x.last.where || `A spot you gave ${starText(x.last.rating)}.`,
        place: visit ? stampLabel(visit.place)
          : me.visits.some(e => x.keys.has(e.spot || e.id)) ? '' : 'No check-in here, so no stamp',
        d: ref ? metres(ref.lat, ref.lon, x.lat, x.lon) : 0,
      };
    }).sort((a, b) => a.d - b.d);
    state.votedList = list;
    const seg = (k, label) => `<button class="segbtn" type="button" data-act="rateTab" data-v="${k}" aria-pressed="${want === k}">${label} (${count(k)})</button>`;

  // "Zürich: 3 of 34 neighbourhoods", for towns where stamps are per neighbourhood or district.
  function progressHTML(country) {
    const towns = new Map();
    for (const st of country.stamps) {
      if (!st.district) continue;
      if (!towns.has(st.town)) towns.set(st.town, 0);
      towns.set(st.town, towns.get(st.town) + 1);
    }
    if (!towns.size) return '';
    const rows = [...towns].map(([town, n]) => {
      const info = subareaInfo(country.country, town);
      const word = info && info.level === 9 ? 'districts' : 'neighbourhoods';
      if (!info || !info.count) return `<p class="progress-row"><span>${esc(town)}: ${n} ${n === 1 ? word.slice(0, -1) : word} so far</span></p>`;
      const pct = Math.min(100, Math.round(n / info.count * 100));
      return `<div class="progress-row"><span>${esc(town)}: ${n} of ${info.count} ${word}</span><span class="bar"><span style="width:${pct}%"></span></span></div>`;
    }).join('');
    return `<div class="progress">${rows}</div>`;
  }

  /* ---------- share cards: a picture of a spot or of your raccoon ---------- */
  function svgImage(svg, w, h) {
    const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `));
    return new Promise((res, rej) => {
      const img = new Image();
      const timer = setTimeout(() => rej(new Error('image took too long')), 4000);
      img.onload = () => { clearTimeout(timer); res(img); };
      img.onerror = e => { clearTimeout(timer); rej(e); };
      img.src = src;
    });
  }
  function wrapText(ctx, text, maxW) {
    const words = text.split(' '), lines = [];
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
    }
    if (line) lines.push(line);
    return lines;
  }
  async function shareCard(kind, s) {
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    try { await document.fonts.load('500 64px "IBM Plex Serif"'); await document.fonts.load('500 36px "IBM Plex Sans"'); } catch (e) { /* fallback fonts */ }
    ctx.fillStyle = '#F6F4EF';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(60, 60, W - 120, H - 120, 48) : ctx.rect(60, 60, W - 120, H - 120); ctx.fill();
    const st = stageOf(me.total);
    let holding = '';
    if (kind === 'spot') { const v = visitsOf(s.id).filter(e => e.emoji).sort((a, b) => b.t - a.t)[0]; holding = v ? v.emoji : ''; }
    try {
      const pic = companionOn() && me.raccoon ? raccoonSVG({ look: look(), mood: 'happy', holding, worn: me.worn, scale: st.scale }) : benchArt;
      const img = await svgImage(pic, 560, companionOn() && me.raccoon ? 509 : 392);
      ctx.drawImage(img, (W - 560) / 2, companionOn() && me.raccoon ? 110 : 170, 560, companionOn() && me.raccoon ? 509 : 392);
    } catch (e) { /* draw without the picture */ }
    ctx.textAlign = 'center';
    ctx.fillStyle = '#23211D';
    let y = 690;
    if (kind === 'spot') {
      const r = myRating(s.id);
      ctx.font = '72px "IBM Plex Serif", Georgia, serif';
      ctx.fillStyle = '#E0A526';
      ctx.fillText('★★★★★'.slice(0, r) + '☆☆☆☆☆'.slice(0, 5 - r), W / 2, y);
      y += 80;
      ctx.fillStyle = '#23211D';
      ctx.font = '500 56px "IBM Plex Serif", Georgia, serif';
      for (const line of wrapText(ctx, s.text.sentence, W - 240).slice(0, 4)) { ctx.fillText(line, W / 2, y); y += 70; }
      const visit = visitsOf(s.id).find(e => e.place);
      const tags = myTags(s.id).map(tagLabel).join(', ');
      ctx.font = '36px "IBM Plex Sans", Helvetica, sans-serif';
      ctx.fillStyle = '#5E5950';
      y += 10;
      if (visit) { ctx.fillText(stampLabel(visit.place), W / 2, y); y += 52; }
      if (tags) { ctx.fillText(tags, W / 2, y); y += 52; }
      ctx.fillText(`${companionOn() && me.raccoon ? cap(petName()) + ' rated' : 'Rated'} it ${starText(r)}: ${ratingWord(r, s.kind).toLowerCase()}`, W / 2, Math.max(y + 10, 1130));
    } else {
      const stamps = passportOf(me.visits).reduce((n, c) => n + c.stamps.length, 0);
      const spots = new Set(me.visits.map(e => e.spot || e.id)).size;
      ctx.font = '500 72px "IBM Plex Serif", Georgia, serif';
      ctx.fillText(cap(petName()), W / 2, y + 20);
      ctx.font = '40px "IBM Plex Sans", Helvetica, sans-serif';
      ctx.fillStyle = '#5E5950';
      ctx.fillText(`${st.label}, ${me.total} snacks eaten`, W / 2, y + 100);
      ctx.fillText(`${spots} ${spots === 1 ? 'spot' : 'spots'} rated, ${stamps} passport ${stamps === 1 ? 'stamp' : 'stamps'}`, W / 2, y + 160);
      const line = voiceOf(me.raccoon, 'happy');
      ctx.font = 'italic 40px "IBM Plex Serif", Georgia, serif';
      ctx.fillStyle = '#23211D';
      let yy = y + 260;
      for (const l of wrapText(ctx, `“${line}”`, W - 280)) { ctx.fillText(l, W / 2, yy); yy += 54; }
    }
    ctx.font = '600 40px "IBM Plex Sans", Helvetica, sans-serif';
    ctx.fillStyle = '#2F5E43';
    ctx.fillText('Sitwell', W / 2, H - 140);
    ctx.font = '30px "IBM Plex Sans", Helvetica, sans-serif';
    ctx.fillStyle = '#5E5950';
    ctx.fillText('Find a lovely spot to linger', W / 2, H - 92);
    const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if (!blob) return;
    const file = new File([blob], kind === 'spot' ? 'sitwell-spot.png' : 'sitwell-raccoon.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Sitwell' });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  /* ---------- interaction ---------- */
  function setMode(mode) {
    if (mode !== 'add') clearPlacing();
    state.mode = mode;
    renderPanel();
  }

  // Centre the pin in the part of the map the sheet doesn't cover.
  function reveal(s) {
    const ll = L.latLng(s.lat, s.lon);
    const opts = { animate: !reduceMotion };
    if (wide.matches) {
      if (!map.getBounds().pad(-0.15).contains(ll)) map.panTo(ll, opts);
      return;
    }
    const z = Math.max(map.getZoom(), CLUSTER_MAX_ZOOM + 1);
    const h = $('#panel').offsetHeight;
    const p = map.project(ll, z).add([0, h / 2]);
    map.setView(map.unproject(p, z), z, opts);
  }

  function openSpot(id) {
    const s = state.spots.find(x => x.id === id);
    if (!s) return;
    state.selected = id;
    state.ckMsg = '';
    state.reveal = null;
    state.rateFor = null;
    setMode('detail');
    renderMarkers();
    $('#panelBody').scrollTop = 0;
    requestAnimationFrame(() => reveal(s));
  }

  // Location confirmed: ask for the rating.
  function verified(s) {
    state.rateFor = s.id;
    state.reveal = null;
    state.ckMsg = '';
    renderPanel();
  }

  function saveRating(s, rating) {
    const now = Date.now();
    state.rateFor = null;
    const base = { t: now, spot: s.id, lat: +s.lat.toFixed(6), lon: +s.lon.toFixed(6), rating, where: s.text.sentence, kind: s.kind, place: null };
    let ev;
    if (!visited(s.id)) {
      // A new spot: the snack, golden snacks, trinkets and streak bonus all come from here.
      const r = s.kind === 'toilet' ? rollToilet(s.id, now) : rollCheckin(s.id, now, me.newSpots, me.trinkets);
      ev = record(Object.assign({
        type: 'checkin', emoji: r.snack.emoji, name: r.snack.name, rare: r.snack.rare, value: r.value,
        first: true, streakBonus: r.streakBonus, trinket: r.trinket,
      }, base));
      state.reveal = Object.assign({ id: s.id, t: now, stamp: null, rating }, r);
    } else {
      ev = record(Object.assign({ type: 'checkin', value: 0, revisit: true }, base));
      state.reveal = { id: s.id, t: now, revisit: true, rating, stamp: null };
    }
    renderPanel();
    renderMarkers();
    if (s.kind !== 'toilet') queuePlace(ev);
  }

  function checkIn(s) {
    if (state.checking) return;
    if (TEST) { verified(s); return; }
    if (!('geolocation' in navigator)) {
      state.ckMsg = 'This browser can’t share your location, so checking in isn’t possible.';
      renderPanel();
      return;
    }
    state.checking = true;
    state.ckMsg = '';
    renderPanel();
    navigator.geolocation.getCurrentPosition(pos => {
      state.checking = false;
      if (state.selected !== s.id) return;
      const { latitude, longitude, accuracy } = pos.coords;
      drawUser({ lat: latitude, lon: longitude }, accuracy);
      state.user = { lat: latitude, lon: longitude };
      const d = Math.min(...s.members.map(mb => metres(latitude, longitude, mb.lat, mb.lon)));
      if (accuracy > GAME.maxAccuracy) {
        state.ckMsg = `Your location is only accurate to about ${Math.round(accuracy)} m. Try again from a more open spot.`;
      } else if (d > GAME.checkinRadius + Math.min(accuracy, GAME.accuracySlack)) {
        state.ckMsg = `You’re about ${fmtDist(d)} away. Get within ${GAME.checkinRadius} m to check in.`;
      } else {
        verified(s);
        return;
      }
      renderPanel();
    }, err => {
      state.checking = false;
      state.ckMsg = err.code === 1
        ? 'Location access is blocked for this page, so checking in isn’t possible.'
        : 'Couldn’t get your location. Try again in a moment.';
      renderPanel();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }

  /* ---------- placing a new pin ---------- */
  let pinMarker = null, fixCircle = null;

  function pinDistText() {
    const a = state.add;
    if (!a.fix || !a.pin) return '';
    const d = metres(a.fix.lat, a.fix.lon, a.pin.lat, a.pin.lon);
    return d < 3 ? 'It’s where you’re standing now.' : `It’s now ${fmtDist(d)} from you.`;
  }

  // Keeps the pin within reach of where you're standing.
  function clampToFix(lat, lon) {
    const f = state.add.fix;
    const d = metres(f.lat, f.lon, lat, lon);
    if (d <= GAME.addMaxDistance) return { lat, lon };
    const k = GAME.addMaxDistance / d;
    return { lat: f.lat + (lat - f.lat) * k, lon: f.lon + (lon - f.lon) * k };
  }

  function movePin(lat, lon) {
    const a = state.add;
    if (!a.fix) return;
    a.pin = clampToFix(lat, lon);
    if (pinMarker) pinMarker.setLatLng([a.pin.lat, a.pin.lon]);
    a.msg = '';
    a.near = null;
    const el = document.getElementById('pinDist');
    if (el) el.textContent = pinDistText();
    const msg = document.querySelector('#panelBody .ck-msg');
    if (msg) msg.textContent = '';
  }

  function clearPlacing() {
    if (pinMarker) { pinMarker.remove(); pinMarker = null; }
    if (fixCircle) { fixCircle.remove(); fixCircle = null; }
  }

  function enterPlacing(lat, lon) {
    const a = state.add;
    a.fix = { lat, lon };
    a.pin = { lat, lon };
    a.step = 'place';
    a.msg = '';
    a.near = null;
    clearPlacing();
    fixCircle = L.circle([lat, lon], {
      radius: GAME.addMaxDistance, color: css('--ink-2'), weight: 1.5, dashArray: '4 5',
      fillColor: css('--ink-3'), fillOpacity: 0.06, interactive: false,
    }).addTo(map);
    pinMarker = L.marker([lat, lon], {
      draggable: true,
      autoPan: true,
      keyboard: true,
      title: 'New pin, drag to move',
      icon: L.divIcon({
        className: 'drop-pin-wrap',
        html: `<div class="drop-pin" style="--c:${colorOf(a.kind)}"></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 36],
      }),
      zIndexOffset: 1000,
    }).addTo(map);
    pinMarker.on('drag', e => {
      const ll = e.target.getLatLng();
      const c = clampToFix(ll.lat, ll.lng);
      if (c.lat !== ll.lat || c.lon !== ll.lng) e.target.setLatLng([c.lat, c.lon]);
      a.pin = c;
      const el = document.getElementById('pinDist');
      if (el) el.textContent = pinDistText();
    });
    pinMarker.on('dragend', e => {
      const ll = e.target.getLatLng();
      movePin(ll.lat, ll.lng);
    });
    renderPanel();
    // Zoom in close, with the pin above the bottom sheet on phones.
    requestAnimationFrame(() => {
      const z = 19, ll = L.latLng(lat, lon);
      const h = wide.matches ? 0 : $('#panel').offsetHeight;
      map.setView(map.unproject(map.project(ll, z).add([0, h / 2]), z), z, { animate: !reduceMotion });
    });
  }

  function confirmPin() {
    const a = state.add;
    if (!a.pin) return;
    placeNewPin(a.pin.lat, a.pin.lon);
  }

  function placeNewPin(lat, lon) {
    const a = state.add, now = Date.now();
    let nearest = null;
    for (const s of state.spots) {
      if (s.kind === 'toilet') continue;
      for (const mb of s.members) {
        const d = metres(lat, lon, mb.lat, mb.lon);
        if (!nearest || d < nearest.d) nearest = { s, mb, d };
      }
    }
    if (nearest && nearest.d < GAME.addMinGap) {
      a.msg = `There’s already a ${nearest.mb.kind === 'table' ? 'picnic table' : 'bench'} mapped ${fmtDist(nearest.d)} from the pin. It’s probably part of this spot.`;
      a.near = nearest.s.id;
      renderPanel();
      return;
    }
    const tags = a.kind === 'bench' && a.backrest ? { backrest: a.backrest } : {};
    const rec = record({ type: 'add', t: now, id: 'user/' + now, kind: a.kind, lat: +lat.toFixed(6), lon: +lon.toFixed(6), tags, rating: a.rating, value: GAME.addReward, place: null });
    queuePlace(rec);
    a.done = rec.id;
    a.step = 'form';
    a.msg = '';
    a.near = null;
    clearPlacing();
    refresh();
  }

  function addHere() {
    const a = state.add;
    if (a.busy) return;
    if (me.adds.filter(e => dayKey(new Date(e.t)) === today()).length >= GAME.addsPerDay) { renderPanel(); return; }
    a.msg = '';
    a.near = null;
    if (TEST) {
      const c = map.getCenter();
      enterPlacing(c.lat, c.lng);
      return;
    }
    if (!('geolocation' in navigator)) {
      a.msg = 'This browser can’t share your location, so adding isn’t possible.';
      renderPanel();
      return;
    }
    a.busy = true;
    renderPanel();
    navigator.geolocation.getCurrentPosition(pos => {
      a.busy = false;
      const { latitude, longitude, accuracy } = pos.coords;
      drawUser({ lat: latitude, lon: longitude }, accuracy);
      state.user = { lat: latitude, lon: longitude };
      if (accuracy > GAME.addMaxAccuracy) {
        a.msg = `Your location is only accurate to about ${Math.round(accuracy)} m, and a new pin needs ${GAME.addMaxAccuracy} m or better. Try again from a more open spot.`;
        renderPanel();
        return;
      }
      if (!state.center || metres(latitude, longitude, state.center.lat, state.center.lon) > SEARCH_RADIUS - 100 || state.phase !== 'ready') {
        a.msg = 'Updating the map around you first, so new pins don’t duplicate mapped ones. Tap Add again in a moment.';
        map.setView([latitude, longitude], Math.max(map.getZoom(), 16), { animate: false });
        showAround({ lat: latitude, lon: longitude }, 'you');
        return;
      }
      enterPlacing(latitude, longitude);
    }, err => {
      a.busy = false;
      a.msg = err.code === 1
        ? 'Location access is blocked for this page, so adding isn’t possible.'
        : 'Couldn’t get your location. Try again in a moment.';
      renderPanel();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
  }

  function closeOverlay() {
    state.selected = null;
    state.reveal = null;
    setMode(wide.matches ? 'peek' : 'list');
    renderMarkers();
  }

  $('#panelBody').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'open') {
      openSpot(el.dataset.id);
    } else if (act === 'back') {
      closeOverlay();
    } else if (act === 'addKind') {
      state.add.kind = el.dataset.v;
      renderPanel();
    } else if (act === 'addBack') {
      state.add.backrest = el.dataset.v;
      renderPanel();
    } else if (act === 'addRate') {
      state.add.rating = Number(el.dataset.v);
      renderPanel();
    } else if (act === 'addHere') {
      addHere();
    } else if (act === 'addConfirm') {
      confirmPin();
    } else if (act === 'addCancel') {
      clearPlacing();
      Object.assign(state.add, { step: 'form', fix: null, pin: null, msg: '', near: null });
      renderPanel();
    } else if (act === 'openAdded') {
      const id = state.add.done;
      state.add.done = null;
      openSpot(id);
    } else if (act === 'openNear') {
      const id = state.add.near;
      state.add.near = null;
      state.add.msg = '';
      openSpot(id);
    } else if (act === 'removeAdded') {
      const s = selectedSpot();
      if (!s || !s.added || s.members.length > 1) return;
      if (!confirm(`Remove this pin? Your raccoon gives back its ${GAME.addReward} snacks.`)) return;
      record({ type: 'remove', t: Date.now(), id: s.id });
      state.selected = null;
      state.mode = wide.matches ? 'peek' : 'list';
      refresh();
    } else if (act === 'rtab') {
      state.rtab = el.dataset.v;
      renderPanel();
      $('#panelBody').scrollTop = 0;
    } else if (act === 'pickSel') {
      state.pickSel = el.dataset.v;
      const top = $('#panelBody').scrollTop;
      renderPanel();
      $('#panelBody').scrollTop = top;
    } else if (act === 'pickConfirm') {
      const sel = state.pickSel || me.raccoon;
      if (!sel) return;
      if (sel !== me.raccoon) record({ type: 'profile', t: Date.now(), raccoon: sel });
      state.picking = false;
      state.pickSel = null;
      state.rtab = 'raccoon';
      renderPanel();
      $('#panelBody').scrollTop = 0;
    } else if (act === 'pickBack') {
      state.picking = false;
      state.pickSel = null;
      renderPanel();
    } else if (act === 'openPick' || act === 'openRaccoon' || act === 'openWardrobe') {
      state.selected = null;
      state.reveal = null;
      state.picking = act === 'openPick' && !!me.raccoon;
      state.pickSel = null;
      state.rtab = act === 'openWardrobe' ? 'wardrobe' : 'raccoon';
      setMode('raccoon');
      renderMarkers();
      $('#panelBody').scrollTop = 0;
    } else if (act === 'wear') {
      const slot = el.dataset.slot, id = el.dataset.v;
      record({ type: 'wear', t: Date.now(), slot, item: me.worn[slot] === id ? null : id });
      const top = $('#panelBody').scrollTop;
      renderPanel();
      $('#panelBody').scrollTop = top;
    } else if (act === 'companionYes' || (act === 'companion' && !companionOn())) {
      record({ type: 'companion', t: Date.now(), on: true });
      state.selected = null;
      state.reveal = null;
      state.picking = !!me.raccoon ? false : true;
      state.rtab = 'raccoon';
      setMode('raccoon');
      renderMarkers();
      $('#panelBody').scrollTop = 0;
    } else if (act === 'companionNo' || act === 'companion') {
      record({ type: 'companion', t: Date.now(), on: false });
      state.rtab = 'rated';
      renderPanel();
      renderMarkers();
    } else if (act === 'sort') {
      state.sortBy = el.dataset.v;
      state.shown = PAGE;
      renderPanel();
    } else if (act === 'tag') {
      const s = selectedSpot();
      if (!s || !canRerate(s.id)) return;
      const cur = new Set(myTags(s.id));
      if (cur.has(el.dataset.v)) cur.delete(el.dataset.v); else cur.add(el.dataset.v);
      record({ type: 'tags', t: Date.now(), spot: s.id, lat: +s.lat.toFixed(6), lon: +s.lon.toFixed(6), tags: [...cur] });
      const top = $('#panelBody').scrollTop;
      renderPanel();
      $('#panelBody').scrollTop = top;
    } else if (act === 'shareSpot') {
      const s = selectedSpot();
      if (s) shareCard('spot', s);
    } else if (act === 'shareRaccoon') {
      shareCard('raccoon');
    } else if (act === 'showIntro') {
      openIntro();
    } else if (act === 'rateTab') {
      state.rateTab = el.dataset.v;
      renderPanel();
    } else if (act === 'openVoted') {
      const x = state.votedList[Number(el.dataset.i)];
      if (!x) return;
      if (x.live) { openSpot(x.live.id); return; }
      // Not in the loaded area: jump there, load it, then open the spot.
      state.pendingOpen = { lat: x.lat, lon: x.lon };
      state.selected = null;
      state.mode = wide.matches ? 'peek' : 'list';
      map.setView([x.lat, x.lon], 17, { animate: false });
      showAround({ lat: x.lat, lon: x.lon }, 'that spot');
    } else if (act === 'showVisited') {
      state.need.visited = true;
      closeOverlay();
      render();
    } else if (act === 'checkin') {
      const s = selectedSpot();
      if (s) checkIn(s);
    } else if (act === 'rename') {
      const n = prompt('What should your raccoon be called?', petName());
      if (n !== null) {
        record({ type: 'profile', t: Date.now(), name: n.trim().slice(0, 24) });
        renderPanel();
      }
    } else if (act === 'more') {
      state.shown += PAGE;
      renderPanel();
    } else if (act === 'retry') {
      showAround(state.center, state.place);
    } else if (act === 'rate') {
      const s = selectedSpot();
      if (!s || state.rateFor !== s.id) return;
      saveRating(s, toNum(el.dataset.v));
    } else if (act === 'rerate') {
      const s = selectedSpot();
      if (!s || !canRerate(s.id)) return;
      const rating = toNum(el.dataset.v);
      record({ type: 'rate', t: Date.now(), spot: s.id, lat: +s.lat.toFixed(6), lon: +s.lon.toFixed(6), rating, where: s.text.sentence, kind: s.kind });
      if (state.reveal && state.reveal.id === s.id) state.reveal.rating = rating;
      const top = $('#panelBody').scrollTop;
      renderPanel();
      renderMarkers();
      $('#panelBody').scrollTop = top;
    } else if (act === 'reset') {
      if (!confirm('Start fresh? This clears your raccoon, snacks, ratings, pins and stamps on this phone.')) return;
      for (const k of [EVENTS_KEY, 'pause.raccoon.v1', 'pause.votes.v1', 'pause.added.v1']) {
        try { localStorage.removeItem(k); } catch (e) { /* ignore */ }
      }
      events = [];
      me = deriveState(events);
      placeQueue.length = 0;
      Object.assign(state, { reveal: null, rateFor: null, picking: false, pickSel: null, rtab: 'raccoon', selected: null });
      updateRaccoonButton();
      refresh();
      setMode('raccoon');
      $('#panelBody').scrollTop = 0;
    }
  });

  $('#sunsetBanner').addEventListener('click', e => {
    const b = e.target.closest('[data-sun]');
    if (!b) return;
    if (b.dataset.sun === 'show') {
      state.need.sunset = true;
      state.shown = PAGE;
      if (state.mode === 'peek' && !wide.matches) state.mode = 'list';
      render();
    } else {
      state.sunsetHidden = dayKey(new Date());
      renderSunsetBanner();
    }
  });
  // Check every few minutes whether the sunset banner should appear.
  setInterval(() => { if (state.phase === 'ready') renderSunsetBanner(); }, 5 * 60000);

  $('#panelToggle').addEventListener('click', () => {
    state.reveal = null;
    if (state.mode === 'peek') setMode('list');
    else {
      state.selected = null;
      setMode('peek');
      renderMarkers();
    }
  });

  document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.type) state.types[btn.dataset.type] = !state.types[btn.dataset.type];
    else state.need[btn.dataset.need] = !state.need[btn.dataset.need];
    state.shown = PAGE;
    const sel = selectedSpot();
    if (sel && !passes(sel)) {
      state.selected = null;
      if (state.mode === 'detail') state.mode = 'peek';
    }
    render();
  }));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.intro) { closeIntro(false); return; }
    if (e.key === 'Escape' && ['detail', 'raccoon', 'add'].includes(state.mode)) closeOverlay();
  });

  $('#addBtn').addEventListener('click', () => {
    if (state.mode === 'add') { closeOverlay(); return; }
    state.selected = null;
    state.reveal = null;
    state.add = { kind: 'bench', backrest: '', rating: '', msg: '', near: null, done: null, busy: false, step: 'form', fix: null, pin: null };
    setMode('add');
    renderMarkers();
    $('#panelBody').scrollTop = 0;
  });

  $('#raccoonBtn').addEventListener('click', () => {
    if (state.mode === 'raccoon') { closeOverlay(); return; }
    state.selected = null;
    state.reveal = null;
    state.picking = false;
    state.pickSel = null;
    state.rtab = companionOn() ? 'raccoon' : 'rated';
    setMode('raccoon');
    renderMarkers();
    $('#panelBody').scrollTop = 0;
  });
  updateRaccoonButton();

  wide.addEventListener('change', () => renderPanel());

  $('#searchHere').addEventListener('click', () => {
    const c = map.getCenter();
    showAround({ lat: c.lat, lon: c.lng }, 'the map centre');
  });

  function drawUser(c, accuracy) {
    if (userMarker) userMarker.remove();
    userMarker = L.layerGroup([
      L.circle([c.lat, c.lon], { radius: Math.min(accuracy || 0, 200), color: '#3A7BD5', weight: 0, fillOpacity: 0.12, interactive: false }),
      L.circleMarker([c.lat, c.lon], { radius: 7, color: '#FFFFFF', weight: 2.5, fillColor: '#3A7BD5', fillOpacity: 1, interactive: false }),
    ]).addTo(map);
  }

  function locate(auto) {
    if (!('geolocation' in navigator)) {
      if (auto) showAround(ZURICH, 'Zurich centre');
      else $('#status').textContent = 'This browser can’t share your location. Move the map and tap Search this area.';
      return;
    }
    $('#locate').disabled = true;
    if (auto) {
      state.phase = 'locating';
      render();
    }
    navigator.geolocation.getCurrentPosition(pos => {
      $('#locate').disabled = false;
      const c = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      drawUser(c, pos.coords.accuracy);
      state.user = c;
      map.setView([c.lat, c.lon], 16, { animate: false });
      showAround(c, 'you');
    }, err => {
      $('#locate').disabled = false;
      const why = err.code === 1 ? 'Location access is blocked for this page.' : 'Your location isn’t available right now.';
      if (auto) showAround(ZURICH, 'Zurich centre');
      else $('#status').textContent = `${why} Move the map and tap Search this area instead.`;
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  }

  $('#locate').addEventListener('click', () => locate(false));
  locate(true);
  try { if (!localStorage.getItem(INTRO_KEY)) openIntro(); } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
