<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sitwell: find a lovely spot to linger</title>
<meta name="description" content="Sitwell: find a lovely spot to linger. Benches, picnic tables and toilets nearby, described by what's around them and rated by people who sat there.">
<meta name="theme-color" content="#F6F4EF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232F5E43'/><rect x='18' y='34' width='64' height='9' rx='3' fill='%23F6F4EF'/><rect x='18' y='48' width='64' height='9' rx='3' fill='%23F6F4EF'/><rect x='14' y='61' width='72' height='8' rx='3' fill='%23F6F4EF'/><rect x='22' y='69' width='7' height='17' rx='2' fill='%23F6F4EF'/><rect x='71' y='69' width='7' height='17' rx='2' fill='%23F6F4EF'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --paper: #F6F4EF;
  --surface: #FFFFFF;
  --ink: #23211D;
  --ink-2: #5E5950;
  --ink-3: #8C867B;
  --line: #E2DDD3;
  --bench: #2F5E43;
  --table: #A0672E;
  --toilet: #2F6496;
  --like: #C4476A;
  --gold: #B8860B;
  --warn: #B07A2A;
  --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #191816;
    --surface: #23211E;
    --ink: #ECE8E0;
    --ink-2: #B7B1A6;
    --ink-3: #8A8479;
    --line: #35322D;
    --bench: #86BB98;
    --table: #D6A36D;
    --toilet: #8AB4DE;
    --like: #E68AA3;
    --gold: #E6BC55;
    --warn: #D9A65A;
    color-scheme: dark;
  }
  .leaflet-tile-pane { filter: brightness(.78) contrast(1.08) saturate(.85); }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--bench); outline-offset: 2px; }

.app { position: relative; height: 100%; display: flex; flex-direction: column; }

/* Header */
.top { flex: none; padding: 10px 16px 9px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.1; letter-spacing: -0.01em; }
.tagline { display: none; margin: 6px 0 0; color: var(--ink-2); font-size: 14px; max-width: 44ch; }

/* Map */
.mapwrap { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--line); }
.leaflet-container { font-family: var(--sans); }
.mapbtns { position: absolute; z-index: 500; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  font-weight: 500;
  font-size: 14px;
  line-height: 1;
  padding: 11px 15px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
}
.pill.strong { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pill:disabled { opacity: .55; cursor: default; }

/* Panel: a bottom sheet on phones, a sidebar on wide screens */
.panel {
  position: absolute;
  z-index: 600;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  max-height: 72%;
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -4px 18px rgba(0, 0, 0, .14);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.panel::before { content: ""; flex: none; width: 36px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--line); }
.panel-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 16px 8px; }
.status { flex: 1; margin: 0; color: var(--ink-2); font-size: 13.5px; }
.link-btn { flex: none; border: 0; background: none; padding: 8px 2px; font-weight: 600; font-size: 14px; color: var(--bench); }
.filters { flex: none; display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.sep { flex: none; width: 1px; margin: 4px 2px; background: var(--line); }
.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  font-weight: 500;
  font-size: 14px;
  line-height: 1;
  padding: 9px 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-2);
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip.type[aria-pressed="true"] { background: var(--paper); border-color: var(--ink-3); color: var(--ink); }
.chip.type[aria-pressed="false"] { color: var(--ink-3); }
.chip.type[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip.need[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.count { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); }
.panel[data-mode="peek"] .panel-body { display: none; }

/* List */
.list { list-style: none; margin: 0; padding: 0; }
.spot { border-bottom: 1px solid var(--line); }
.spot-head {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  gap: 0 14px;
  width: 100%;
  padding: 15px 16px;
  border: 0;
  background: none;
  text-align: left;
}
.spot-head:focus-visible { outline-offset: -2px; }
.spot.disliked .spot-head { opacity: .55; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.spot-head .dot { margin-top: 8px; }
.spot-body { display: block; min-width: 0; }
.sentence { display: block; font-family: var(--serif); font-size: 17.5px; line-height: 1.4; color: var(--ink); }
.comfort { display: block; margin-top: 3px; font-size: 14px; color: var(--ink-2); }
.comfort.quiet { color: var(--ink-3); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 9px; font-size: 13.5px; color: var(--ink); }
.fact .d { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.facts.warn { margin-top: 5px; color: var(--ink-3); }
.facts.warn .d { color: var(--ink-3); }
.facts.warn .fact::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--warn);
  vertical-align: 2px;
}
.dist { padding-top: 3px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.liked { display: block; margin-top: 4px; color: var(--like); font-size: 12.5px; font-weight: 500; }
.more { display: block; margin: 14px 16px 4px; }
.note { margin: 0; padding: 14px 16px 20px; color: var(--ink-3); font-size: 12.5px; max-width: 60ch; }
.note a { color: inherit; }
.message { padding: 16px; color: var(--ink-2); font-size: 14.5px; }
.message p { margin: 0 0 12px; max-width: 52ch; }
.message .detail-line { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }

/* Detail */
.detail { padding: 4px 16px 20px; }
.detail-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.detail-nav .dist { padding: 0; }
.kind { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; font-size: 13.5px; color: var(--ink-2); }
.sentence.big { font-size: 21px; line-height: 1.35; }
.votes { display: flex; gap: 8px; margin-top: 18px; }
.vote {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-weight: 500;
}
.vote svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.vote.like[aria-pressed="true"] { background: var(--like); border-color: var(--like); color: var(--paper); }
.vote.like[aria-pressed="true"] svg { fill: currentColor; }
.vote.dislike[aria-pressed="true"] { background: var(--ink-2); border-color: var(--ink-2); color: var(--paper); }
.fine { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.actions a {
  font-weight: 500;
  font-size: 14px;
  line-height: 1;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  text-decoration: none;
}
.actions .go { background: var(--bench); border-color: var(--bench); color: var(--paper); }
.measured-box { margin-top: 18px; }
.measured-box summary { cursor: pointer; padding: 6px 0; font-size: 13.5px; color: var(--ink-2); }
.measured { display: grid; grid-template-columns: max-content 1fr; gap: 3px 16px; margin: 6px 0 0; font-size: 13px; }
.measured dt { color: var(--ink-3); }
.measured dd { margin: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* Check-in and raccoon */
.tag { display: block; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); }
.vote:disabled { opacity: .45; cursor: default; }
.checkin { margin-top: 18px; padding: 14px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.checkin.rare { border-color: var(--gold); }
.ck-lead { margin: 0; font-size: 14.5px; color: var(--ink); }
.ck-emoji { font-size: 20px; vertical-align: -2px; margin-right: 4px; }
.ck-btn {
  margin-top: 10px;
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 12px;
  background: var(--ink);
  color: var(--paper);
  font-weight: 600;
  font-size: 15px;
}
.ck-btn:disabled { opacity: .6; cursor: default; }
.ck-msg { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.reveal { display: flex; align-items: center; gap: 14px; }
.reveal .snack {
  flex: none;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--surface);
  font-size: 36px;
  line-height: 1;
  animation: pop .5s ease-out both;
}
.checkin.rare .reveal .snack { background: radial-gradient(circle, #FFF1C2 0%, #F2C94C 70%, var(--gold) 100%); }
.reveal-text strong { display: block; font-family: var(--serif); font-weight: 500; font-size: 18px; line-height: 1.3; }
.reveal-text span { display: block; margin-top: 2px; font-size: 13.5px; color: var(--ink-2); }
@keyframes pop {
  from { transform: scale(.4); opacity: 0; }
  70% { transform: scale(1.12); opacity: 1; }
  to { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .reveal .snack { animation: none; } }
.raccoon-art { display: flex; justify-content: center; margin: 2px 0 4px; }
.raccoon-art svg { width: 200px; height: auto; }
.rc-head { display: flex; align-items: baseline; justify-content: center; gap: 10px; }
.rc-name { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 24px; }
.rc-line { margin: 4px auto 0; max-width: 40ch; text-align: center; color: var(--ink); font-size: 14.5px; }
.rc-line.quiet { color: var(--ink-2); font-size: 13.5px; }
.rc-section { margin: 22px 0 4px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.log { list-style: none; margin: 0 0 12px; padding: 0; }
.log li { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.log .em { font-size: 24px; text-align: center; }
.log .what { font-size: 14px; min-width: 0; }
.log .where { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .val { font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.log .val small { display: block; font-size: 12px; color: var(--ink-3); }
.log li.rare .what { color: var(--gold); font-weight: 600; }

/* Adding a bench */
.add-title { margin: 8px 0 4px; font-family: var(--serif); font-weight: 500; font-size: 21px; }
.field-label { margin: 16px 0 6px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.seg { display: flex; gap: 6px; }
.segbtn {
  flex: 1;
  padding: 11px 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-weight: 500;
  font-size: 14px;
}
.segbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.add-title + .fine { margin-top: 2px; }
.detail .ck-btn { margin-top: 18px; }
.actions .plain, .actions button.go {
  font-weight: 500;
  font-size: 14px;
  line-height: 1;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper);
}
.actions button.go { background: var(--bench); border-color: var(--bench); color: var(--paper); }

/* The draggable pin for a new bench */
.drop-pin-wrap { background: none; border: 0; }
.drop-pin {
  width: 30px;
  height: 30px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  background: var(--c);
  border: 3px solid var(--paper);
  box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  cursor: grab;
}
.drop-pin::after {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: var(--paper);
}

/* Bubbles for nearby spots when zoomed out */
.bubble-wrap { background: none; border: 0; }
.bubble {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--ink);
  color: var(--paper);
  border: 2px solid var(--paper);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
  font: 600 12.5px/1 var(--sans);
  font-variant-numeric: tabular-nums;
}

/* Raccoon panel: tabs, picker, wardrobe, passport */
.tabs {
  display: flex;
  gap: 4px;
  margin: 8px 0 6px;
  padding: 3px;
  border-radius: 12px;
  background: var(--paper);
  border: 1px solid var(--line);
}
.tab { flex: 1; padding: 9px 6px; border: 0; border-radius: 9px; background: transparent; font-weight: 500; font-size: 14px; color: var(--ink-2); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.raccoon-art.small svg { width: 150px; }
.pick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.pick {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 8px 8px 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--paper);
  text-align: center;
}
.pick svg { width: 100%; max-width: 132px; height: auto; }
.pick[aria-pressed="true"] { background: var(--surface); border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.pick-name { font-family: var(--serif); font-size: 17px; font-weight: 500; color: var(--ink); }
.pick-line { font-size: 12.5px; line-height: 1.35; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 6px 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink);
  text-align: center;
}
.tile svg { width: 100%; height: auto; }
.tile[aria-pressed="true"] { background: var(--surface); border-color: var(--bench); box-shadow: inset 0 0 0 1.5px var(--bench); }
.tile.locked { justify-content: center; min-height: 88px; border-style: dashed; color: var(--ink-3); font-weight: 400; }
.tile .q { font-family: var(--serif); font-size: 26px; line-height: 1; }
/* Stamps sit on paper in both light and dark mode, like a real passport page. */
.stamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; border-radius: 12px; background: #FBF8F1; }
.stamp svg { display: block; width: 100%; height: auto; }
.passport-intro { margin-top: 10px; text-align: left; max-width: none; }
.found { margin: 10px 0 0; font-size: 14px; color: var(--ink); }
.found .link-btn { padding: 0 2px; }

.voted-switch { margin-top: 12px; }
.list.voted { margin: 0 -16px; border-top: 1px solid var(--line); }
.tab { font-size: 13.5px; }

/* Ratings */
.rate-q { font-family: var(--serif); font-size: 18px; }
.rate-row { display: flex; gap: 6px; margin-top: 10px; }
.ratebtn {
  flex: 1;
  padding: 13px 6px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 600;
  font-size: 15px;
}
.rate-row.small .ratebtn { padding: 10px 6px; font-size: 14px; font-weight: 500; background: var(--paper); }
.ratebtn.lovely[aria-pressed="true"] { background: var(--like); border-color: var(--like); color: var(--paper); }
.ratebtn.okay[aria-pressed="true"] { background: var(--ink-2); border-color: var(--ink-2); color: var(--paper); }
.ratebtn.notgreat[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--paper); }
.rerate { margin-top: 14px; }
.rerate .field-label { margin-top: 0; }
.tag.lovely { color: var(--like); font-weight: 600; }
.tag.notgreat { color: var(--warn); }
.actions.reset { margin-top: 22px; }

.rate-row.four { flex-wrap: wrap; }
.rate-row.four .ratebtn { flex: 1 1 40%; }
.ratebtn.clean[aria-pressed="true"] { background: var(--bench); border-color: var(--bench); color: var(--paper); }
.ratebtn.avoid[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--paper); }
.ratebtn.closed[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tag.clean { color: var(--bench); font-weight: 600; }
.tag.avoid, .tag.closed { color: var(--warn); }

/* Star ratings */
.stars { display: flex; gap: 4px; margin-top: 10px; }
.star {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 2px 9px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}
.star .glyph { font-size: 28px; line-height: 1; color: var(--line); }
.star.on .glyph { color: #E0A526; }
.star .word { font-size: 11px; line-height: 1.2; text-align: center; color: var(--ink-2); }
.star[aria-pressed="true"] { border-color: #E0A526; box-shadow: inset 0 0 0 1.5px #E0A526; }
.stars.small .star { padding: 6px 2px 7px; background: var(--paper); }
.stars.small .glyph { font-size: 22px; }
.closedbtn {
  width: 100%;
  margin-top: 6px;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-weight: 500;
  font-size: 14px;
}
.closedbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tag.nice { color: var(--bench); font-weight: 600; }
.tag.low { color: var(--warn); }

/* Sorting, promising spots, tags */
.sorter { margin: 12px 16px; }
.tag.promising { color: #A87A10; font-weight: 600; }
.promise-line { margin: 8px 0 0; font-size: 14px; color: #8A6A1E; }
@media (prefers-color-scheme: dark) { .tag.promising, .promise-line { color: var(--gold); } }
.tagchips { display: flex; flex-wrap: wrap; gap: 6px; }

/* The raccoon's voice */
.bubble-line { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0 4px; }
.bubble-face { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.bubble-face svg { display: block; width: 100%; height: 100%; }
.speech {
  margin: 0;
  padding: 10px 12px;
  border-radius: 4px 14px 14px 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  font-family: var(--serif);
  font-size: 15.5px;
  line-height: 1.4;
  color: var(--ink);
}

<script id="core">
/* ============================================================
   Core: query building, geometry and the surroundings summary.
   No DOM access here, so it can be tested on its own.
   ============================================================ */

// Thresholds in metres. Tune these against benches you know.
const RULES = {
  lake: 40,           // "lakeside"
  river: 30,          // "riverside"
  stream: 20,         // "by a stream"
  promenade: 15,      // "on a promenade" (named footpath or pedestrian street)
  pond: 40,           // "by a pond" / "by the water"
  forestEdge: 20,     // "at the forest edge"
  view: 50,           // "with a view" (mapped viewpoint)
  landmark: 60,       // "near Grossmünster" (named landmark)
  sunsetFrom: 225,    // nearest lake or river lies between these compass directions,
  sunsetTo: 315,      // so looking at the water means looking at the sunset
  shadeRadius: 12,    // trees counted within this radius...
  shadeTrees: 2,      // ...need at least this many for "likely shaded"
  shelter: 6,         // "roofed" if a shelter is this close
  busyRoad: 30,       // warning: main road
  railway: 50,        // warning: railway
  tram: 20,           // warning: tram line
  stop: 15,           // warning: bus or tram stop
  drinkingWater: 300, // nearby
  toilet: 400,
  food: 400,
  bin: 20,
  bikeParking: 50,
};
const SEARCH_RADIUS = 1500;   // spots are shown within this distance
const GROUP_RADIUS = 15;      // benches and tables this close to a spot's first seat form one spot
const FETCH_RADIUS = 5000;    // data is loaded and saved on the phone this far around you
const TILE_LAT = 0.03;        // data is fetched in squares of about 3.3 km...
const TILE_LON = 0.045;       // ...so moving around reuses what's already saved
const TILE_MAX_AGE_DAYS = 14; // saved squares older than this are refreshed in the background
const TILE_VERSION = 2;       // bump when the query changes, so saved squares are refreshed
const MEASURE_LIMIT = 250;    // line and area distances are measured up to this

const MATERIAL = { wood: 'wooden', metal: 'metal', steel: 'metal', stone: 'stone', granite: 'stone', concrete: 'concrete', plastic: 'plastic' };
const FOOD_LABEL = { bakery: 'Bakery', supermarket: 'Supermarket', convenience: 'Corner shop' };

function clipBox(c, half) {
  const dLat = half / 110574;
  const dLon = half / (111320 * Math.cos(c.lat * Math.PI / 180));
  return [c.lat - dLat, c.lon - dLon, c.lat + dLat, c.lon + dLon];
}

function expandBox(box, m) {
  const dLat = m / 110574, dLon = m / (111320 * Math.cos((box[0] + box[2]) / 2 * Math.PI / 180));
  return [box[0] - dLat, box[1] - dLon, box[2] + dLat, box[3] + dLon];
}
function tileBox(id) {
  const [i, j] = id.split('_').map(Number);
  return [i * TILE_LAT, j * TILE_LON, (i + 1) * TILE_LAT, (j + 1) * TILE_LON];
}
// Squares that touch a circle, nearest first.
function tilesForCircle(c, r) {
  const dLat = r / 110574, dLon = r / (111320 * Math.cos(c.lat * Math.PI / 180));
  const proj = makeProj(c), out = [];
  for (let i = Math.floor((c.lat - dLat) / TILE_LAT); i <= Math.floor((c.lat + dLat) / TILE_LAT); i++) {
    for (let j = Math.floor((c.lon - dLon) / TILE_LON); j <= Math.floor((c.lon + dLon) / TILE_LON); j++) {
      const id = i + '_' + j, b = tileBox(id);
      const [x, y] = proj(Math.min(Math.max(c.lat, b[0]), b[2]), Math.min(Math.max(c.lon, b[1]), b[3]));
      const d = Math.hypot(x, y);
      if (d <= r) out.push({ id, d });
    }
  }
  return out.sort((a, b) => a.d - b.d).map(t => t.id);
}

function buildTileQuery(box) {
  const bb = box.map(v => v.toFixed(5)).join(',');
  const clip = expandBox(box, 120).map(v => v.toFixed(5)).join(',');
  return `[out:json][timeout:45][maxsize:268435456][bbox:${bb}];
make section name="spots";out;
(
  node["amenity"="bench"];
  way["amenity"="bench"];
  node["leisure"="picnic_table"];
  way["leisure"="picnic_table"];
  nwr["amenity"="toilets"];
);
out center qt;
make section name="pois";out;
(
  nwr["amenity"="drinking_water"];
  nwr["amenity"="fountain"]["drinking_water"="yes"];
  nwr["man_made"="water_tap"]["drinking_water"="yes"];
  nwr["shop"~"^(bakery|supermarket|convenience)$"];
  nwr["amenity"="bicycle_parking"];
  nwr["tourism"="viewpoint"];
  nwr["amenity"="shelter"];
  nwr["historic"~"^(castle|monument|ruins|city_gate|fort|tower|manor|church)$"]["name"];
  nwr["amenity"="place_of_worship"]["name"];
  nwr["tourism"~"^(attraction|museum|artwork)$"]["name"];
  nwr["amenity"="fountain"]["name"];
  node["highway"="bus_stop"];
  node["railway"="tram_stop"];
  node["public_transport"="platform"];
);
out center qt;
make section name="trees";out;
node["natural"="tree"];
out skel qt;
make section name="bins";out;
node["amenity"="waste_basket"];
out skel qt;
make section name="lines";out;
(
  way["highway"~"^(motorway|trunk|primary|secondary)(_link)?$"]["tunnel"!~"^(yes|building_passage)$"];
  way["highway"~"^(pedestrian|footway|path)$"]["name"]["footway"!~"^(sidewalk|crossing|traffic_island)$"]["tunnel"!="yes"];
  way["railway"~"^(rail|light_rail|narrow_gauge)$"]["tunnel"!="yes"];
  way["railway"="tram"]["tunnel"!="yes"];
  way["waterway"~"^(river|canal|stream)$"]["tunnel"!~"^(yes|culvert)$"];
  way["natural"="tree_row"];
  way["natural"="water"];
  relation["natural"="water"];
);
out geom(${clip});
make section name="areas";out;
(
  way["leisure"~"^(park|garden)$"];
  relation["leisure"~"^(park|garden)$"];
  way["landuse"="cemetery"];
  relation["landuse"="cemetery"];
  way["amenity"="grave_yard"];
  way["landuse"="forest"];
  relation["landuse"="forest"];
  way["natural"="wood"];
  relation["natural"="wood"];
);
out geom;`;
}

// Keeps only what the summaries need, so saved squares stay small.
const KEEP_TAGS = new Set(['amenity', 'leisure', 'highway', 'railway', 'waterway', 'natural', 'water', 'landuse', 'tourism',
  'shop', 'man_made', 'drinking_water', 'access', 'garden:type', 'public_transport', 'bus', 'tram', 'footway', 'tunnel',
  'backrest', 'material', 'covered', 'seats', 'direction', 'fee', 'charge', 'opening_hours', 'wheelchair', 'changing_table']);
function slimTags(t) {
  const o = {};
  for (const k in t) if (KEEP_TAGS.has(k)) o[k] = t[k];
  return o;
}
function slimTile(json, box) {
  const s = splitSections(json);
  const r6 = v => Math.round(v * 1e6) / 1e6;
  const pts = g => g.map(p => (p && p.lat != null ? { lat: r6(p.lat), lon: r6(p.lon) } : null));
  const pt = (el, keepName) => {
    const o = { type: el.type, id: el.id, tags: slimTags(el.tags || {}) };
    if (keepName && el.tags && el.tags.name) o.tags.name = el.tags.name;
    if (el.lat != null) { o.lat = r6(el.lat); o.lon = r6(el.lon); } else if (el.center) o.center = { lat: r6(el.center.lat), lon: r6(el.center.lon) };
    return o;
  };
  const shape = (el, clip) => {
    const o = { type: el.type, id: el.id, tags: slimTags(el.tags || {}) };
    if (el.geometry) o.geometry = pts(el.geometry);
    if (el.members) o.members = el.members.filter(m => m.type === 'way' && m.geometry).map(m => ({ type: 'way', geometry: pts(m.geometry) }));
    if (clip) o.clip = clip;
    return o;
  };
  const flat = list => {
    const a = [];
    for (const el of list) if (el.lat != null) a.push(r6(el.lat), r6(el.lon));
    return a;
  };
  const clip = expandBox(box, 120);
  return {
    spots: s.spots.map(el => pt(el)), pois: s.pois.map(el => pt(el, true)), trees: flat(s.trees), bins: flat(s.bins),
    lines: s.lines.map(el => shape(el, clip)), areas: s.areas.map(el => shape(el, null)),
  };
}
// Combines saved squares. Points and areas appear once; clipped lines keep each square's piece.
function mergeTiles(list) {
  const out = { spots: [], pois: [], trees: [], bins: [], lines: [], areas: [] };
  const seen = { spots: new Set(), pois: new Set(), areas: new Set() };
  for (const d of list) {
    for (const k of ['spots', 'pois', 'areas']) {
      for (const el of d[k]) {
        const key = el.type + '/' + el.id;
        if (seen[k].has(key)) continue;
        seen[k].add(key);
        out[k].push(el);
      }
    }
    for (const el of d.lines) out.lines.push(el);
    out.trees.push(d.trees);
    out.bins.push(d.bins);
  }
  return out;
}

function buildQuery(c, R = SEARCH_RADIUS) {
  const R1 = R + 60;    // local context (roads, trees, water...)
  const R2 = R + 420;   // amenities that count as "nearby"
  const ll = `${c.lat.toFixed(6)},${c.lon.toFixed(6)}`;
  const a = r => `(around:${r},${ll})`;
  const bb = clipBox(c, R1 + 150).map(v => v.toFixed(6)).join(',');
  return `[out:json][timeout:45][maxsize:268435456];
make section name="spots";out;
(
  node["amenity"="bench"]${a(R)};
  way["amenity"="bench"]${a(R)};
  node["leisure"="picnic_table"]${a(R)};
  way["leisure"="picnic_table"]${a(R)};
  nwr["amenity"="toilets"]${a(R2)};
);
out center qt;
make section name="pois";out;
(
  nwr["amenity"="drinking_water"]${a(R2)};
  nwr["amenity"="fountain"]["drinking_water"="yes"]${a(R2)};
  nwr["man_made"="water_tap"]["drinking_water"="yes"]${a(R2)};
  nwr["shop"~"^(bakery|supermarket|convenience)$"]${a(R2)};
  nwr["amenity"="bicycle_parking"]${a(R1)};
  nwr["tourism"="viewpoint"]${a(R1)};
  nwr["amenity"="shelter"]${a(R1)};
  node["highway"="bus_stop"]${a(R1)};
  node["railway"="tram_stop"]${a(R1)};
  node["public_transport"="platform"]${a(R1)};
);
out center qt;
make section name="trees";out;
node["natural"="tree"]${a(R1)};
out skel qt;
make section name="bins";out;
node["amenity"="waste_basket"]${a(R1)};
out skel qt;
make section name="lines";out;
(
  way["highway"~"^(motorway|trunk|primary|secondary)(_link)?$"]["tunnel"!~"^(yes|building_passage)$"]${a(R1)};
  way["highway"~"^(pedestrian|footway|path)$"]["name"]["footway"!~"^(sidewalk|crossing|traffic_island)$"]["tunnel"!="yes"]${a(R1)};
  way["railway"~"^(rail|light_rail|narrow_gauge)$"]["tunnel"!="yes"]${a(R1)};
  way["railway"="tram"]["tunnel"!="yes"]${a(R1)};
  way["waterway"~"^(river|canal|stream)$"]["tunnel"!~"^(yes|culvert)$"]${a(R1)};
  way["natural"="tree_row"]${a(R1)};
  way["natural"="water"]${a(R1)};
  relation["natural"="water"]${a(R1)};
);
out geom(${bb});
make section name="areas";out;
(
  way["leisure"~"^(park|garden)$"]${a(R1)};
  relation["leisure"~"^(park|garden)$"]${a(R1)};
  way["landuse"="cemetery"]${a(R1)};
  relation["landuse"="cemetery"]${a(R1)};
  way["amenity"="grave_yard"]${a(R1)};
  way["landuse"="forest"]${a(R1)};
  relation["landuse"="forest"]${a(R1)};

/* ---------- geometry helpers (local metric coordinates) ---------- */

function makeProj(c) {
  const kx = 111320 * Math.cos(c.lat * Math.PI / 180), ky = 110574;
  return (lat, lon) => [(lon - c.lon) * kx, (lat - c.lat) * ky];
}

  if (el.lat != null) return [el.lat, el.lon];
  if (el.center) return [el.center.lat, el.center.lon];
  return null;
}
// Turns a way or relation into a flat list of segments [x1,y1,x2,y2, ...].
// Clipped output may contain nulls; gaps are never bridged.
function buildFeature(el, proj, clipHalf) {

  const box = el.clip;
  const offBox = g => box ? (g.lat < box[0] || g.lat > box[2] || g.lon < box[1] || g.lon > box[3]) : false;
  const offHalf = p => clipHalf && (Math.abs(p[0]) > clipHalf || Math.abs(p[1]) > clipHalf);
  const add = geom => {
    let prev = null, prevG = null;
    for (const g of geom) {
      if (!g || g.lat == null) { prev = null; prevG = null; continue; }
      const p = proj(g.lat, g.lon);
      // A segment with both ends outside the clip area can be a bridge over omitted nodes, so skip it.
      if (prev && !(offBox(prevG) && offBox(g)) && !(offHalf(prev) && offHalf(p))) segs.push(prev[0], prev[1], p[0], p[1]);
      prev = p;
      prevG = g;
    }
  };
  if (el.type === 'way' && el.geometry) add(el.geometry);
  if (el.type === 'relation' && el.members) {
    for (const m of el.members) if (m.type === 'way' && m.geometry) add(m.geometry);
  }
  if (!segs.length) return null;
  let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
  for (let i = 0; i < segs.length; i += 2) {
    const x = segs[i], y = segs[i + 1];
    if (x < minx) minx = x; if (x > maxx) maxx = x;
    if (y < miny) miny = y; if (y > maxy) maxy = y;
  }
  return { segs, minx, miny, maxx, maxy, tags: el.tags || {} };

function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
  let t = L ? ((px - x1) * dx + (py - y1) * dy) / L : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;

    const s = f.segs;

// Compass direction from one point to another: 0 north, 90 east, 180 south, 270 west.

/* ---------- classification ---------- */

const isClosed = t => /^(private|no)$/.test(t.access || '');
function stopLabel(t) {
  if (t.railway === 'tram_stop' || t.tram === 'yes') return 'Tram stop';
  if (t.highway === 'bus_stop' || t.bus === 'yes') return 'Bus stop';
  return 'Stop';
}
function waterKind(t) {
  const w = t.water;
  if (!w) return 'water';
  if (/^(lake|reservoir|lagoon)$/.test(w)) return 'lake';
  if (/^(river|canal|oxbow)$/.test(w)) return 'river';
  if (/^(wastewater|basin|fish_pass|stream|ditch|moat)$/.test(w)) return null;
  return 'pond';
}
function splitSections(json) {
  const s = { spots: [], pois: [], trees: [], bins: [], lines: [], areas: [] };
  let cur = null;
  for (const el of json.elements || []) {
    if (el.type === 'section') { cur = el.tags && el.tags.name; continue; }
    if (cur && s[cur]) s[cur].push(el);
  }
  return s;
}

/* ---------- analysis ---------- */

function analyse(json, center, R = SEARCH_RADIUS) {
  const sec = splitSections(json);
  sec.trees = [sec.trees.flatMap(el => (el.lat != null ? [el.lat, el.lon] : []))];
  sec.bins = [sec.bins.flatMap(el => (el.lat != null ? [el.lat, el.lon] : []))];
  return analyseSections(sec, center, R, R + 60 + 150);
}

function analyseSections(sec, center, R = SEARCH_RADIUS, clipHalf = null) {
  const proj = makeProj(center);

  const P = { drink: [], food: [], bike: [], view: [], shelter: [], stop: [], toilet: [], landmark: [] };
  const addPt = (list, el, extra) => {
    const c = coordOf(el);
    if (!c) return;
    const [x, y] = proj(c[0], c[1]);
    list.push(Object.assign({ x, y, key: el.type + '/' + el.id }, extra));
  };
  for (const el of sec.pois) {
    const t = el.tags || {};
    if (isClosed(t)) continue;
    if (t.amenity === 'drinking_water' && t.drinking_water !== 'no') addPt(P.drink, el);
    if ((t.amenity === 'fountain' || t.man_made === 'water_tap') && t.drinking_water === 'yes') addPt(P.drink, el);
    if (FOOD_LABEL[t.shop]) addPt(P.food, el, { label: FOOD_LABEL[t.shop] });
    if (t.amenity === 'bicycle_parking') addPt(P.bike, el);
    if (t.tourism === 'viewpoint') addPt(P.view, el);
    if (t.amenity === 'shelter') addPt(P.shelter, el);
    if (t.name && (t.historic || t.amenity === 'place_of_worship' || /^(attraction|museum|artwork)$/.test(t.tourism || '')
      || (t.amenity === 'fountain' && t.drinking_water !== 'yes'))) addPt(P.landmark, el, { label: t.name });
    if (t.highway === 'bus_stop' || t.railway === 'tram_stop' || t.public_transport === 'platform') addPt(P.stop, el, { label: stopLabel(t) });
  }
  for (const el of sec.spots) {
    const t = el.tags || {};
    if (t.amenity === 'toilets' && !isClosed(t)) addPt(P.toilet, el);
  }

  const trees = makeGrid(20), bins = makeGrid(20);
  for (const a of sec.trees) for (let i = 0; i < a.length; i += 2) gridAdd(trees, ...proj(a[i], a[i + 1]));
  for (const a of sec.bins) for (let i = 0; i < a.length; i += 2) gridAdd(bins, ...proj(a[i], a[i + 1]));

  const Lf = { road: [], promenade: [], rail: [], tram: [], river: [], stream: [], lake: [], pond: [], water: [], treerow: [] };
  for (const el of sec.lines) {
    const t = el.tags || {};
    let b = null;
    if (/^(pedestrian|footway|path)$/.test(t.highway || '')) b = 'promenade';
    else if (t.highway) b = 'road';
    else if (t.railway === 'tram') b = 'tram';
    else if (t.railway) b = 'rail';
    else if (t.waterway === 'stream') b = 'stream';
    else if (t.waterway) b = 'river';
    else if (t.natural === 'tree_row') b = 'treerow';
    else if (t.natural === 'water') b = waterKind(t);
    if (!b) continue;
    const f = buildFeature(el, proj, clipHalf);
    if (f) Lf[b].push(f);
  }

  const A = { park: [], garden: [], cemetery: [], forest: [] };
  for (const el of sec.areas) {
    const t = el.tags || {};
    let b = null;
    if (t.landuse === 'cemetery' || t.amenity === 'grave_yard') b = 'cemetery';
    else if (t.leisure === 'park') b = 'park';
    else if (t.leisure === 'garden') b = (isClosed(t) || /^(residential|private)$/.test(t['garden:type'] || '')) ? null : 'garden';
    else if (t.landuse === 'forest' || t.natural === 'wood') b = 'forest';
    if (!b) continue;
    const f = buildFeature(el, proj, null);
    if (f) A[b].push(f);
  }

  const D = { P, Lf, A, trees, bins };
  const spots = [], seats = [];
  for (const el of sec.spots) {
    const t = el.tags || {};
    const kind = t.amenity === 'bench' ? 'bench' : t.leisure === 'picnic_table' ? 'table' : t.amenity === 'toilets' ? 'toilet' : null;
    if (!kind || isClosed(t)) continue;
    const c = coordOf(el);
    if (!c) continue;
    const [x, y] = proj(c[0], c[1]);
    const dist = Math.hypot(x, y);
    const id = el.type + '/' + el.id;
    const item = { id, el, kind, lat: c[0], lon: c[1], x, y, dist, tags: t, added: el.type === 'user' };
    if (kind === 'toilet') {
      if (dist > R) continue;
      const spot = {
        id, osmType: el.type, osmId: el.id, kind, lat: c[0], lon: c[1], dist, tags: t, added: false,
        members: [{ id, kind, lat: c[0], lon: c[1], added: false }], counts: { bench: 0, table: 0 }, hasBench: false, hasTable: false,
      };
      spot.m = measure(x, y, id, D);
      spot.text = describe(spot);
      spot.flags = flagsOf(spot.m);
      spots.push(spot);
    } else if (dist <= R + GROUP_RADIUS) {
      seats.push(item);
    }
  }

  // Group seats into spots. Each spot is a circle of GROUP_RADIUS around its first seat,
  // so a row of benches along a promenade becomes a row of spots instead of one long chain.
  // Older OpenStreetMap entries go first, so spots keep the same first seat over time.
  const rank = s => (s.added ? 2 : s.el.type === 'node' ? 0 : 1);
  seats.sort((a, b) => rank(a) - rank(b) || Number(a.el.id) - Number(b.el.id));
  const grid = new Map(), cell = GROUP_RADIUS;
  seats.forEach((s, i) => {
    const k = Math.floor(s.x / cell) + ',' + Math.floor(s.y / cell);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  });
  const used = new Uint8Array(seats.length);
  seats.forEach((seed, i) => {
    if (used[i]) return;
    used[i] = 1;
    const members = [seed];
    const cx = Math.floor(seed.x / cell), cy = Math.floor(seed.y / cell);
    for (let a = cx - 1; a <= cx + 1; a++) {
      for (let b = cy - 1; b <= cy + 1; b++) {
        for (const j of grid.get(a + ',' + b) || []) {
          if (used[j]) continue;
          if (Math.hypot(seats[j].x - seed.x, seats[j].y - seed.y) <= GROUP_RADIUS) { used[j] = 1; members.push(seats[j]); }
        }
      }
    }
    const mx = members.reduce((n, s) => n + s.x, 0) / members.length;
    const my = members.reduce((n, s) => n + s.y, 0) / members.length;
    const dist = Math.hypot(mx, my);
    if (dist > R) return;

      id: seed.id, osmType: seed.el.type, osmId: seed.el.id,
      kind: counts.bench ? 'bench' : 'table',
      lat: members.reduce((n, s) => n + s.lat, 0) / members.length,
      lon: members.reduce((n, s) => n + s.lon, 0) / members.length,
      dist, tags: groupTags(members), added: seed.added,
      members: members.map(s => ({ id: s.id, kind: s.kind, lat: s.lat, lon: s.lon, added: s.added })),
      counts, hasBench: counts.bench > 0, hasTable: counts.table > 0,
    };
    spot.m = combineMeasures(members.map(s => measure(s.x, s.y, s.id, D)));
    spot.text = describe(spot);
    spot.flags = flagsOf(spot.m);
    spot.estimate = estimateOf(spot);
    spots.push(spot);
  });

}

// A spot is described by its best and worst seats: nearest water, nearest road, and so on.
function combineMeasures(list) {
  if (list.length === 1) return list[0];
  const m = {};
  for (const k of Object.keys(list[0])) {
    const vals = list.map(x => x[k]);
    if (typeof vals[0] === 'number') m[k] = k === 'trees' ? Math.max(...vals) : Math.min(...vals);
    else if (typeof vals[0] === 'boolean') m[k] = vals.some(Boolean);

  m.stopLabel = list.reduce((a, b) => (b.stop < a.stop ? b : a)).stopLabel;

  m.waterDir = wet.waterDir;
  m.landmarkName = list.reduce((a, b) => (b.landmark < a.landmark ? b : a)).landmarkName;
  m.foodLabel = list.reduce((a, b) => (b.food < a.food ? b : a)).foodLabel;
  return m;
}
function groupTags(members) {
  if (members.length === 1) return members[0].tags;
  const benches = members.filter(s => s.kind === 'bench');
  const t = {};
  const backs = benches.map(s => s.tags.backrest);
  if (backs.length && backs.every(v => v === 'yes')) t.backrest = 'yes';
  else if (backs.some(v => v === 'yes')) t.backrest = 'some';
  else if (backs.length && backs.every(v => v === 'no')) t.backrest = 'no';
  const mats = benches.map(s => s.tags.material);
  if (mats.length && mats[0] && mats.every(v => v === mats[0])) t.material = mats[0];
  if (members.some(s => s.tags.covered === 'yes')) t.covered = 'yes';
  return t;
}

function measure(x, y, key, D) {
  const line = list => nearestLine(list, x, y);
  const near = list => nearestPoint(list, x, y, key);
  const m = {};
  m.lake = line(D.Lf.lake);
  m.river = line(D.Lf.river);
  // Which way the nearest lake or river lies, for "sunset over the water".
  const wl = nearestLinePoint(D.Lf.lake, x, y), wr = nearestLinePoint(D.Lf.river, x, y);
  const w = wl && (!wr || wl.d <= wr.d) ? wl : wr;
  m.waterDir = w ? Math.round(bearingTo(x, y, w.x, w.y)) : -1;
  m.stream = line(D.Lf.stream);
  m.promenade = line(D.Lf.promenade);
  m.pond = line(D.Lf.pond);
  m.water = line(D.Lf.water);
  m.inPark = D.A.park.some(f => inside(f, x, y));
  m.inGarden = D.A.garden.some(f => inside(f, x, y));
  m.inCemetery = D.A.cemetery.some(f => inside(f, x, y));
  m.inForest = D.A.forest.some(f => inside(f, x, y));
  m.forestEdge = line(D.A.forest);

  const lm = near(D.P.landmark);
  m.landmark = lm.d;
  m.landmarkName = lm.item ? lm.item.label : '';
  m.trees = gridScan(D.trees, x, y, RULES.shadeRadius).count;
  m.treeRow = line(D.Lf.treerow);
  m.shelter = near(D.P.shelter).d;
  m.road = line(D.Lf.road);
  m.rail = line(D.Lf.rail);
  m.tram = line(D.Lf.tram);
  const st = near(D.P.stop);
  m.stop = st.d;
  m.stopLabel = st.item ? st.item.label : 'Stop';
  m.drink = near(D.P.drink).d;
  m.toilet = near(D.P.toilet).d;
  const fd = near(D.P.food);
  m.food = fd.d;
  m.foodLabel = fd.item ? fd.item.label : 'Shop';
  m.bin = gridScan(D.bins, x, y, 60).nearest;

}

/* ---------- the summary ---------- */

const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

function describe(s) {
  const t = s.tags, m = s.m, R = RULES;
  const facts = [], warnings = [];
  const where =
    m.inCemetery ? 'in a cemetery' :
    m.inPark ? 'in a park' :
    m.inGarden ? 'in a garden' :
    m.inForest ? 'in the woods' :
    m.forestEdge <= R.forestEdge ? 'at the forest edge' : '';

  if (s.kind === 'toilet') {
    const fee = t.fee === 'no' ? 'free' : t.fee === 'yes' ? 'paid' : '';
    const noun = t.access === 'customers' ? 'toilet for customers' : 'public toilet';
    let sentence = [fee, noun].filter(Boolean).join(' ') + (where ? ' ' + where : '');
    if (t.fee === 'yes' && t.charge) sentence += ` (${t.charge})`;
    const c = [];
    const oh = (t.opening_hours || '').trim();
    if (oh === '24/7') c.push('open 24/7');
    else if (oh) c.push('hours ' + (oh.length > 48 ? oh.slice(0, 46) + '…' : oh));
    if (t.wheelchair === 'yes') c.push('wheelchair accessible');
    else if (t.wheelchair === 'limited') c.push('limited wheelchair access');
    else if (t.wheelchair === 'no') c.push('not wheelchair accessible');
    if (t.changing_table === 'yes') c.push('changing table');
    if (m.drink <= R.drinkingWater) facts.push({ label: 'Drinking water', d: m.drink });
    if (m.food <= R.food) facts.push({ label: m.foodLabel, d: m.food });
    if (m.bike <= R.bikeParking) facts.push({ label: 'Bike parking', d: m.bike });
    return {
      sentence: cap(sentence) + '.',
      comfort: c.length ? cap(c.join(', ')) + '.' : '',
      note: !fee && !oh ? 'Fee and opening hours not mapped.' : '',
      facts, warnings,
    };
  }

  const nb = s.counts ? s.counts.bench : s.kind === 'bench' ? 1 : 0;
  const nt = s.counts ? s.counts.table : s.kind === 'table' ? 1 : 0;
  const mat = MATERIAL[t.material] ? MATERIAL[t.material] + ' ' : '';
  let noun;
  if (nb + nt <= 1) noun = mat + (nt ? 'picnic table' : 'bench');
  else if (nb <= 1 && nt <= 1) noun = 'bench and picnic table';
  else if (!nt) noun = `group of ${nb} ${mat}benches`;
  else if (!nb) noun = `group of ${nt} picnic tables`;
  else noun = `group of ${nb} ${nb === 1 ? 'bench' : mat + 'benches'} and ${nt === 1 ? 'a picnic table' : nt + ' picnic tables'}`;
  const lakeside = m.lake <= R.lake;
  const riverside = !lakeside && m.river <= R.river;
  const head = [lakeside ? 'lakeside' : riverside ? 'riverside' : '', noun].filter(Boolean).join(' ');
  const tail = [];
  if (where) tail.push(where);
  if (m.promenade <= R.promenade) tail.push('on a promenade');
  if (!lakeside && !riverside) {
    if (m.stream <= R.stream) tail.push('by a stream');
    else if (m.pond <= R.pond) tail.push('by a pond');
    else if (m.water <= R.pond) tail.push('by the water');
  }
  if (m.landmark <= R.landmark && m.landmarkName) tail.push(`near ${m.landmarkName}`);
  if (m.view <= R.view) tail.push('with a view');
  if (sunsetWater(m)) tail.push('with sunsets over the water');
  const sentence = cap(head + (tail.length ? ' ' + tail.join(', ') : '')) + '.';

  const c = [];
  if (nb) {
    if (t.backrest === 'yes') c.push(nb > 1 ? 'backrests' : 'backrest');
    else if (t.backrest === 'some') c.push('some with backrest');
    else if (t.backrest === 'no') c.push('no backrest');
  }
  if (t.covered === 'yes' || m.shelter <= R.shelter) c.push('roofed');
  if (!m.inForest && (m.trees >= R.shadeTrees || m.treeRow <= R.shadeRadius)) c.push('likely shaded');

  if (m.drink <= R.drinkingWater) facts.push({ label: 'Drinking water', d: m.drink });
  if (m.toilet <= R.toilet) facts.push({ label: 'Toilet', d: m.toilet });
  if (m.food <= R.food) facts.push({ label: m.foodLabel, d: m.food });
  if (m.bin <= R.bin) facts.push({ label: 'Bin', d: m.bin });
  if (m.bike <= R.bikeParking) facts.push({ label: 'Bike parking', d: m.bike });

  if (m.road <= R.busyRoad) warnings.push({ label: 'Busy road', d: m.road });
  if (m.rail <= R.railway) warnings.push({ label: 'Railway', d: m.rail });
  if (m.tram <= R.tram) warnings.push({ label: 'Tram line', d: m.tram });
  if (m.stop <= R.stop) warnings.push({ label: m.stopLabel, d: m.stop });

  return {
    sentence,
    comfort: c.length ? cap(c.join(', ')) + '.' : '',
    note: !tail.length && !c.length && head === noun && nb + nt <= 1 ? 'Nothing notable mapped around it.' : '',
    facts, warnings,
  };
}

// A first guess at how nice a spot is (1 to 5), from its surroundings alone.
// Used before anyone has rated it, so a new town doesn't look empty.
const PROMISING_FROM = 4.0;
function estimateOf(s) {
  if (s.kind === 'toilet') return null;
  const m = s.m, R = RULES, t = s.tags || {};
  let x = 2.6;
  if (m.lake <= R.lake || m.river <= R.river) x += 1.2;
  else if (m.stream <= R.stream || m.pond <= R.pond || m.water <= R.pond) x += 0.8;
  if (m.inPark || m.inGarden) x += 0.6;
  if (m.inForest || m.forestEdge <= R.forestEdge) x += 0.6;
  if (m.view <= R.view) x += 0.8;
  if (sunsetWater(m)) x += 0.3;
  if (m.landmark <= R.landmark && m.landmarkName) x += 0.3;
  if (m.promenade <= R.promenade) x += 0.3;
  if (m.trees >= R.shadeTrees || m.treeRow <= R.shadeRadius) x += 0.2;
  if (t.backrest === 'yes' || t.backrest === 'some') x += 0.2;
  if (m.inCemetery) x -= 0.6;
  if (m.road <= R.busyRoad) x -= 1.0;
  if (m.rail <= R.railway) x -= 0.6;
  if (m.tram <= R.tram) x -= 0.3;
  if (m.stop <= R.stop) x -= 0.7;
  return Math.max(1, Math.min(5, Math.round(x * 10) / 10));
}

// Sunset time for a place and day, calculated on the phone (the standard solar formulas, as in SunCalc).
// Returns null where the sun doesn't set that day.
function sunsetAt(date, lat, lon) {
  const rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009;
  const e = rad * 23.4397;
  const d = date.valueOf() / dayMs - 0.5 + J1970 - J2000;
  const lw = rad * -lon, phi = rad * lat;
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const cosW = (Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
  if (cosW < -1 || cosW > 1) return null;
  const w = Math.acos(cosW);
  const a = J0 + (w + lw) / (2 * Math.PI) + n;
  const Jset = J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return new Date((Jset + 0.5 - J1970) * dayMs);
}

// The nearest lake or river lies to the west, so looking at the water means looking at the sunset.
function sunsetWater(m) {
  const R = RULES;
  return (m.lake <= R.lake || m.river <= R.river) && m.waterDir >= R.sunsetFrom && m.waterDir <= R.sunsetTo;
}

// Yes/no features used by the filters.
function flagsOf(m) {
  const R = RULES;
  return {
    water: m.lake <= R.lake || m.river <= R.river || m.stream <= R.stream || m.pond <= R.pond || m.water <= R.pond,
    green: m.inPark || m.inGarden || m.inForest || m.forestEdge <= R.forestEdge,
    quiet: !(m.road <= R.busyRoad || m.rail <= R.railway || m.tram <= R.tram || m.stop <= R.stop),
  };
}

function compass(deg) {
  return ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round(deg / 45) % 8];
}

function fmtDist(d) {
  if (!isFinite(d)) return 'none nearby';
  if (d < 5) return 'under 5 m';
  if (d < 100) return Math.round(d / 5) * 5 + ' m';
  if (d < 1000) return Math.round(d / 10) * 10 + ' m';
  if (d < 10000) return (d / 1000).toFixed(1).replace(/\.0$/, '') + ' km';
  return Math.round(d / 1000).toLocaleString('en') + ' km';
}

// Raw measurements, shown when a spot is opened, for checking the rules.
function measuredRows(s) {
  const m = s.m, d = fmtDist;
  const inside = [m.inPark && 'park', m.inGarden && 'garden', m.inCemetery && 'cemetery', m.inForest && 'woods'].filter(Boolean);
  const rows = [
    ['Lake', d(m.lake)],
    ['River', d(m.river)],
    ['Stream', d(m.stream)],
    ['Pond or other water', d(Math.min(m.pond, m.water))],
    ['Inside', inside.length ? inside.join(', ') : 'no park, garden, cemetery or woods'],
    ['Forest edge', d(m.forestEdge)],
    ['Named footpath', d(m.promenade)],
    ['Viewpoint', d(m.view)],
    ['Landmark', m.landmarkName && isFinite(m.landmark) ? `${m.landmarkName}, ${d(m.landmark)}` : d(m.landmark)],
    ['Water lies to the', m.waterDir >= 0 ? compass(m.waterDir) + ` (${m.waterDir}°)` : 'no lake or river nearby'],
    [`Trees within ${RULES.shadeRadius} m`, String(m.trees)],
    ['Tree row', d(m.treeRow)],
    ['Shelter', d(m.shelter)],
    ['Main road', d(m.road)],
    ['Railway', d(m.rail)],
    ['Tram line', d(m.tram)],
    ['Bus or tram stop', d(m.stop)],
    ['Drinking water', d(m.drink)],
    ['Toilet', d(m.toilet)],
    ['Bakery or shop', d(m.food)],
    ['Bin', d(m.bin)],
    ['Bike parking', d(m.bike)],
  ];
  const keys = ['backrest', 'material', 'covered', 'seats', 'direction', 'fee', 'charge', 'opening_hours', 'wheelchair', 'changing_table', 'access'];
  const tags = keys.filter(k => s.tags[k]).map(k => `${k}=${s.tags[k]}`).join(', ');
  rows.push(['Mapped details', tags || 'none of the useful ones']);
  return rows;
}

/* ---------- rules ---------- */

// Small, fast string hash (FNV-1a). Same input, same number, on every phone and on the server.
function hash32(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function dayKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// Today's snack at a spot is the same for everyone.
function snackFor(spotId, day) {
  const [emoji, name] = SNACKS[hash32(spotId + '|' + day) % SNACKS.length];
  const rare = hash32('rare|' + day + '|' + spotId) % GAME.rareOneIn === 0;
  return { emoji, name, rare };
}
// Monday 00:00 of the week containing t (local time).
function weekStart(t) {
  const d = new Date(t);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
// Consecutive weeks (Monday to Sunday) with at least one visit. This week counts once it has a visit;
// until then, a streak that reached last week is still alive.
function streakOf(times, now) {
  const weeks = new Set(times.map(t => dayKey(weekStart(t))));
  const cur = weekStart(now);
  const thisWeek = weeks.has(dayKey(cur));
  const cursor = new Date(cur);
  if (!thisWeek) cursor.setDate(cursor.getDate() - 7);
  let n = 0;
  while (weeks.has(dayKey(cursor))) { n++; cursor.setDate(cursor.getDate() - 7); }
  return { weeks: n, thisWeek };
}
// What rating a new spot gives. Return visits give nothing, so people rate many different spots.
// newSpotTimes and owned describe the person before this check-in.
function rollCheckin(spotId, now, newSpotTimes, owned) {
  const day = dayKey(new Date(now));
  const snack = snackFor(spotId, day);
  const st = streakOf(newSpotTimes, now);
  const streakBonus = !st.thisWeek && st.weeks >= 1 ? GAME.streakBonus : 0;
  let trinket = null;
  if (hash32('trinket|' + day + '|' + spotId) % GAME.trinketOneIn === 0) {
    const left = TRINKETS.filter(x => !owned.includes(x.id));
    if (left.length) trinket = left[hash32('pick|' + day + '|' + spotId) % left.length].id;
  }
  const value = (snack.rare ? GAME.rareValue : GAME.newSpotValue) + streakBonus;
  return { snack, trinket, streakBonus, value, first: true };
}

// Rating a new toilet: one plain snack, no golden snacks, trinkets or streak bonus.
function rollToilet(spotId, now) {

}

function deriveState(events) {
  const s = {
    raccoon: null, name: '', companion: null, total: 0, rares: 0, lastFed: 0,
    visits: [], ratings: [], notes: [], newSpots: [], pins: [], adds: [], trinkets: [], worn: { head: null, face: null, neck: null },
  };
  const removed = new Set(events.filter(e => e.type === 'remove').map(e => e.id));
  for (const e of events) {
    if (e.type === 'profile') {
      if (e.raccoon) s.raccoon = e.raccoon;
      if (e.name != null) s.name = e.name;
      // Older histories that chose a raccoon had the companion on.
      if (e.raccoon && s.companion === null) s.companion = true;
    } else if (e.type === 'companion') {
      s.companion = !!e.on;
    } else if (e.type === 'checkin') {
      s.visits.push(e);
      if (e.rating) s.ratings.push(Object.assign({}, e, { rating: normRating(e.rating) }));
      if ((e.first || e.value) && e.kind !== 'toilet') s.newSpots.push(e.t);
      s.total += e.value || 0;
      if (e.rare) s.rares += 1;
      if (e.value) s.lastFed = Math.max(s.lastFed, e.t);
      if (e.trinket && !s.trinkets.includes(e.trinket)) s.trinkets.push(e.trinket);
    } else if (e.type === 'add') {
      s.adds.push(e);
      if (removed.has(e.id)) continue;
      s.pins.push(e);
      s.visits.push(e);
      s.newSpots.push(e.t);
      if (e.rating) s.ratings.push(Object.assign({}, e, { rating: normRating(e.rating) }));
      s.total += e.value || 0;
      s.lastFed = Math.max(s.lastFed, e.t);
    } else if (e.type === 'legacy') {
      s.total += e.value || 0;
    } else if (e.type === 'rate') {
      s.ratings.push(Object.assign({}, e, { rating: normRating(e.rating) }));
    } else if (e.type === 'vote') {
      // Likes and dislikes from earlier versions become ratings.
      const rating = e.v === 1 ? 5 : e.v === -1 ? 2 : null;
      if (rating) s.ratings.push(Object.assign({}, e, { rating }));
    } else if (e.type === 'tags') {
      s.notes.push(e);
    } else if (e.type === 'wear') {
      s.worn[e.slot] = e.item || null;

// Passport stamps: one per town, or per district in big cities, grouped by country.
// Stamps show the neighbourhood where it's officially mapped, otherwise the district, otherwise the town.
// Some countries map their finest level too finely for stamps, so it's capped there.
const PLACE_MAX_LEVEL = { HR: 9 };   // Croatia: level 10 is Zagreb's many small local committees
function placeParts(place) {
  const max = PLACE_MAX_LEVEL[place.code] || 10;
  const sub = (max >= 10 && place.neighbourhood) || place.district || '';

}
function stampLabel(place) {

}
function passportOf(visits) {
  const countries = new Map();
  for (const e of visits) {
    if (!e.place || !e.place.town || e.kind === 'toilet') continue;
    const c = e.place.country || 'Somewhere';
    const label = stampLabel(e.place);
    if (!countries.has(c)) countries.set(c, new Map());
    const m = countries.get(c);
    if (!m.has(label)) m.set(label, { label, town: e.place.town, district: placeParts(e.place).sub, first: e.t, spots: new Set() });
    const st = m.get(label);
    st.first = Math.min(st.first, e.t);
    st.spots.add(e.spot || e.id);
  }
  return [...countries].map(([country, m]) => ({
    country,
    stamps: [...m.values()].sort((a, b) => a.first - b.first).map(x => Object.assign({}, x, { spots: x.spots.size })),
  })).sort((a, b) => a.stamps[0].first - b.stamps[0].first);
}

function stageOf(total) {
  let i = 0;
  while (i + 1 < STAGES.length && total >= STAGES[i + 1].at) i++;
  const next = STAGES[i + 1] || null;
  return Object.assign({}, STAGES[i], { next, toNext: next ? next.at - total : 0 });
}
function moodOf(lastFed, now) {
  if (!lastFed) return { key: 'hungry', label: 'Hungry and waiting for its first snack' };
  const day = t => new Date(t).setHours(0, 0, 0, 0);
  const days = Math.round((day(now) - day(lastFed)) / 86400000);
  if (days <= 0) return { key: 'happy', label: 'Full and happy' };
  if (days <= 2) return { key: 'content', label: 'Content' };
  if (days <= 6) return { key: 'peckish', label: 'Getting peckish' };
  return { key: 'hungry', label: `Hungry, last fed ${days} days ago` };
}

      <rect x="115" y="69" width="35" height="19" rx="8" fill="#151515" stroke="#E9E4DA" stroke-width="2"/>
      <path d="M105 75 q5 -4 10 0" stroke="#E9E4DA" stroke-width="3" fill="none"/>

      <circle cx="88" cy="78" r="13" fill="#FFFFFF" fill-opacity=".14" stroke="#C9A227" stroke-width="2.6"/>
      <circle cx="132" cy="78" r="13" fill="#FFFFFF" fill-opacity=".14" stroke="#C9A227" stroke-width="2.6"/>
      <path d="M101 77 q9 -6 18 0" stroke="#C9A227" stroke-width="2.6" fill="none"/>`;
    case 'scarf': return `
      <rect x="72" y="111" width="76" height="15" rx="7.5" fill="#C0504D"/>

      <path d="M121 140 l13 -2 M120 134 l13 -2" stroke="#F2EEE7" stroke-width="2"/>
      <path d="M80 113 v11 M92 112 v13 M104 112 v13" stroke="#A33F3C" stroke-width="2"/>`;
    case 'bandana': return `
      <path d="M74 111 L146 111 L110 142 Z" fill="#3B6EA8"/>
      <rect x="72" y="108" width="76" height="7" rx="3.5" fill="#2C5687"/>
      ${[[96, 119], [110, 120], [124, 119], [103, 128], [117, 128], [110, 135]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.8" fill="#FFFFFF"/>`).join('')}`;
    case 'bowtie': return `

// opts: { scale, mood, holding, look, worn: {head, face, neck}, viewBox }
function raccoonSVG(opts) {
  const o = Object.assign({ scale: 1, mood: 'content', holding: '', look: RACCOONS[0], worn: {}, viewBox: '0 0 220 200' }, opts);
  const L = o.look, scale = o.scale, mood = o.mood;
  const x = new Set(L.extras || []);
  const pupil = '#1F1C1A';
  const bx = 110;

  // Body shape
  const B = { classic: [50, 38, 146], chubby: [57, 41, 147], slim: [43, 43, 144], tiny: [42, 32, 152] }[L.body] || [50, 38, 146];
  const rx = B[0] * scale, ry = B[1] + (scale - 1) * 14, by = B[2];
  const footY = by + ry - 2;
  const pawCol = x.has('socks') ? L.light : x.has('pinkPaws') ? '#E8B4BC' : L.paw;

  // Tail
  const T = {
    classic: { pts: [[183, 95], [179, 108], [173, 121], [165, 133], [156, 145], [146, 156]], r: [15, 13] },
    bushy: { pts: [[188, 90], [184, 104], [177, 118], [168, 131], [158, 143], [147, 155]], r: [20, 17] },
    thin: { pts: [[184, 92], [181, 101], [177, 110], [172, 119], [166, 127], [159, 135], [152, 143], [144, 151], [136, 158]], r: [13, 9] },
    broad: { pts: [[183, 97], [176, 116], [165, 133], [151, 149]], r: [17, 16] },
  }[L.tail] || null;
  const tail = T.pts.map(([px, py], i) =>
    `<ellipse cx="${px}" cy="${py}" rx="${T.r[0]}" ry="${T.r[1]}" transform="rotate(-55 ${px} ${py})" fill="${i % 2 === 0 ? L.band : L.tail2}"/>`).join('');

  // Ears
  const classicEar = (cx, rot) => `<ellipse cx="${cx}" cy="45" rx="13" ry="17" transform="rotate(${rot} ${cx} 45)" fill="${L.fur}"/>
    <ellipse cx="${cx}" cy="47" rx="7" ry="10" transform="rotate(${rot} ${cx} 47)" fill="${L.paw}"/>`;
  let ears;
  if (L.ears === 'pointy') {
    ears = [[76, -18], [144, 18]].map(([cx, r]) => `
      <ellipse cx="${cx}" cy="40" rx="11" ry="22" transform="rotate(${r} ${cx} 40)" fill="${L.fur}"/>
      <ellipse cx="${cx}" cy="43" rx="5.5" ry="13" transform="rotate(${r} ${cx} 43)" fill="${L.paw}"/>
      <ellipse cx="${cx + (r < 0 ? -6 : 6)}" cy="22" rx="5" ry="6" transform="rotate(${r} ${cx + (r < 0 ? -6 : 6)} 22)" fill="${L.band}"/>`).join('');
  } else if (L.ears === 'round') {
    ears = `<circle cx="80" cy="51" r="12" fill="${L.fur}"/><circle cx="80" cy="52" r="6.5" fill="${L.paw}"/>
      <circle cx="140" cy="51" r="12" fill="${L.fur}"/><circle cx="140" cy="52" r="6.5" fill="${L.paw}"/>`;
  } else if (L.ears === 'floppy') {
    // Left ear up, right ear flopped over sideways
    ears = classicEar(79, -25) + `
      <ellipse cx="149" cy="54" rx="12" ry="17" transform="rotate(68 149 54)" fill="${L.fur}"/>
      <ellipse cx="150" cy="54" rx="6.5" ry="10" transform="rotate(68 150 54)" fill="${L.paw}"/>`;
  } else {
    ears = classicEar(79, -25) + classicEar(141, 25) +
      (L.ears === 'tufts' ? `<path d="M68 33 l-4 -13 l11 9 z M152 33 l4 -13 l-11 9 z" fill="${L.band}"/>` : '');
  }

  // Fluffy ruff around the face: a ring of soft scallops behind the head
  const mane = x.has('mane') ? Array.from({ length: 20 }, (_, i) => {
    const a = (i / 20) * Math.PI * 2;
    return `<circle cx="${(110 + Math.cos(a) * 47).toFixed(1)}" cy="${(86 + Math.sin(a) * 40).toFixed(1)}" r="11" fill="${L.tail2}"/>`;
  }).join('') : '';

  // Head-top details (hats cover them, which is fine)
  let top = '';
  if (x.has('cowlick')) top += `<path d="M104 47 q-3 -9 3 -13 M110 46 q0 -11 7 -13 M116 47 q4 -8 9 -8" stroke="${L.fur}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  if (x.has('spiky')) top += `<path d="M98 50 l3 -15 l6 11 l3 -16 l3 16 l6 -11 l3 15 z" fill="${L.fur}"/>`;
  if (x.has('curl')) top += `<path d="M110 46 c-1 -9 10 -11 10 -3 c0 5 -7 5 -6 0" stroke="${L.fur}" stroke-width="4" fill="none" stroke-linecap="round"/>`;

  // Forehead
  let forehead = `<ellipse cx="110" cy="58" rx="6" ry="14" fill="${L.band}"/>`;
  if (x.has('blaze')) forehead = `<ellipse cx="110" cy="60" rx="5" ry="15" fill="${L.light}"/>`;
  if (x.has('crescent')) forehead = `<path d="M103 52 a8 8 0 1 0 14 0 a6.5 6.5 0 1 1 -14 0 z" fill="${L.light}"/>`;
  const brows = x.has('brows')
    ? `<path d="M73 66 q13 -9 26 -2 M121 64 q13 -7 26 2" stroke="${L.light}" stroke-width="6" fill="none" stroke-linecap="round"/>` : '';

  // Eyes, by mood and eye style
  const style = L.eyes || 'normal';
  const lashes = style === 'lashes'
    ? `<path d="M80 72 l-4 -4 M83 70 l-2 -5 M140 72 l4 -4 M137 70 l2 -5" stroke="${L.light}" stroke-width="2" stroke-linecap="round"/>` : '';
  let eyes, mouth;
  if (mood === 'happy') {
    eyes = `<path d="M81 80 q7 -7 14 0 M125 80 q7 -7 14 0" stroke="${L.light}" stroke-width="3" fill="none" stroke-linecap="round"/>` + lashes;
    mouth = `<path d="M100 101 q10 9 20 0" stroke="${L.mask}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else {
    const big = mood === 'hungry';
    const r = big ? 7 : style === 'sparkle' ? 6.5 : 5.5;
    const pr = big ? 4.2 : 3.2;
    const py = big ? 76 : 78.5;
    const eye = cx => {
      let s = `<circle cx="${cx}" cy="78" r="${r}" fill="${L.light}"/>`;
      if (style === 'amber') s += `<circle cx="${cx}" cy="${py}" r="${pr + 1.3}" fill="#D9932B"/>`;
      s += `<circle cx="${cx}" cy="${py}" r="${style === 'amber' ? pr - 0.6 : pr}" fill="${pupil}"/>`;
      s += `<circle cx="${cx + 1.4}" cy="${py - 1.5}" r="${style === 'sparkle' ? 1.8 : 1.2}" fill="#fff"/>`;
      if (style === 'sparkle') s += `<circle cx="${cx - 1.8}" cy="${py + 1.6}" r="0.9" fill="#fff"/>`;
      if (style === 'sleepy') s += `<path d="M${cx - r - 1} ${78 - r - 1} h${2 * r + 2} v${r + (big ? -1 : 1)} h-${2 * r + 2} z" fill="${L.mask}"/>
        <path d="M${cx - r} ${78 + (big ? -1 : 1)} h${2 * r}" stroke="${L.light}" stroke-width="1.4" stroke-linecap="round"/>`;
      return s;
    };
    eyes = eye(88) + eye(132) + lashes;
    if (mood === 'peckish') eyes += `<path d="M81 70 l12 3 M139 70 l-12 3" stroke="${L.light}" stroke-width="2.2" stroke-linecap="round"/>`;
    mouth = mood === 'hungry' ? `<ellipse cx="110" cy="104" rx="3.5" ry="4" fill="${L.mask}"/>`
      : mood === 'peckish' ? `<path d="M103 102 h14" stroke="${L.mask}" stroke-width="2.5" stroke-linecap="round"/>`
      : `<path d="M103 101 q7 5 14 0" stroke="${L.mask}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  }
  const teeth = x.has('teeth') && mood !== 'hungry'
    ? `<rect x="105.2" y="${mood === 'happy' ? 104.5 : 103}" width="4.4" height="5" rx="1.2" fill="#FFFFFF" stroke="${L.band}" stroke-width=".6"/>
       <rect x="110.4" y="${mood === 'happy' ? 104.5 : 103}" width="4.4" height="5" rx="1.2" fill="#FFFFFF" stroke="${L.band}" stroke-width=".6"/>` : '';
  const nose = x.has('pinkNose') ? '#D9798B' : L.mask;
  const freckles = x.has('freckles')
    ? [[100, 100], [97, 104], [103, 105], [120, 100], [123, 104], [117, 105]].map(([fx, fy]) => `<circle cx="${fx}" cy="${fy}" r="1.3" fill="${L.band}"/>`).join('') : '';
  const blush = x.has('blush') ? `<ellipse cx="72" cy="97" rx="8" ry="4.5" fill="#E89AA6" opacity=".65"/><ellipse cx="148" cy="97" rx="8" ry="4.5" fill="#E89AA6" opacity=".65"/>` : '';
  const whiskers = x.has('whiskers')
    ? `<path d="M91 96 l-22 -4 M91 100 l-22 2 M129 96 l22 -4 M129 100 l22 2" stroke="${L.band}" stroke-width="1.3" stroke-linecap="round"/>` : '';
  const earring = x.has('earring') ? `<circle cx="70" cy="58" r="3" fill="#E3B43B" stroke="#B8860B" stroke-width="1"/>` : '';
  const speckles = x.has('speckles')
    ? [[-34, -18], [-38, 4], [-26, 22], [32, -16], [38, 6], [26, 24], [-14, -30], [16, -30]].map(([dx, dy]) =>
      `<circle cx="${bx + dx * scale}" cy="${by + dy}" r="2.2" fill="${L.band}" opacity=".45"/>`).join('') : '';
  const bellyW = 31 * scale * (L.body === 'chubby' ? 1.12 : L.body === 'slim' || L.body === 'tiny' ? 0.88 : 1);
  const bellyH = 26 + (scale - 1) * 10 - (L.body === 'tiny' ? 5 : 0);
  const belly = x.has('heartBelly')
    ? `<path d="M${bx} ${by + 26} C ${bx - bellyW * 1.3} ${by + 4}, ${bx - bellyW * 0.9} ${by - 22}, ${bx} ${by - 8} C ${bx + bellyW * 0.9} ${by - 22}, ${bx + bellyW * 1.3} ${by + 4}, ${bx} ${by + 26} Z" fill="${L.belly}"/>`
    : `<ellipse cx="${bx}" cy="${by + 7}" rx="${bellyW}" ry="${bellyH}" fill="${L.belly}"/>`;
  const snack = o.holding ? `<text x="${bx}" y="${by + 4}" font-size="26" text-anchor="middle" dominant-baseline="middle">${o.holding}</text>` : '';
  const worn = o.worn || {};
  return `<svg viewBox="${o.viewBox}" role="img" aria-label="${L.name}, ${mood}">
    ${tail}
    <ellipse cx="${bx - 28 * scale}" cy="${footY}" rx="13" ry="7" fill="${pawCol}"/>
    <ellipse cx="${bx + 28 * scale}" cy="${footY}" rx="13" ry="7" fill="${pawCol}"/>
    <ellipse cx="${bx}" cy="${by}" rx="${rx}" ry="${ry}" fill="${L.fur}"/>
    ${speckles}
    ${belly}
    ${snack}
    <ellipse cx="${bx - 24 * scale}" cy="${by}" rx="7" ry="11" transform="rotate(-25 ${bx - 24 * scale} ${by})" fill="${pawCol}"/>
    <ellipse cx="${bx + 24 * scale}" cy="${by}" rx="7" ry="11" transform="rotate(25 ${bx + 24 * scale} ${by})" fill="${pawCol}"/>
    ${mane}
    ${ears}
    ${earring}
    ${top}
    <ellipse cx="110" cy="82" rx="46" ry="38" fill="${L.fur}"/>
    <ellipse cx="70" cy="96" rx="12" ry="10" fill="${L.tail2}"/><ellipse cx="150" cy="96" rx="12" ry="10" fill="${L.tail2}"/>
    <ellipse cx="90" cy="63" rx="14" ry="7" fill="${L.light}"/>
    <ellipse cx="130" cy="63" rx="14" ry="7" fill="${L.light}"/>
    ${forehead}
    ${brows}
    <ellipse cx="88" cy="79" rx="19" ry="12" fill="${L.mask}"/>
    <ellipse cx="132" cy="79" rx="19" ry="12" fill="${L.mask}"/>
    <ellipse cx="110" cy="78" rx="10" ry="8" fill="${L.mask}"/>
    ${blush}
    <ellipse cx="110" cy="97" rx="20" ry="14" fill="${L.light}"/>
    ${whiskers}
    ${freckles}
    <ellipse cx="110" cy="90" rx="6" ry="4.5" fill="${nose}"/>
    ${eyes}
    ${mouth}
    ${teeth}
    ${worn.neck ? trinketSVG(worn.neck) : ''}
    ${worn.face ? trinketSVG(worn.face) : ''}
    ${worn.head ? trinketSVG(worn.head) : ''}
  </svg>`;
}
// A trinket on its own, cropped from a raccoon head, for the wardrobe tiles.
const SLOT_VIEW = { head: '56 12 108 62', face: '62 56 96 44', neck: '62 98 96 54' };
function trinketTileSVG(id, look) {
  const t = TRINKETS.find(x => x.id === id);
  return raccoonSVG({ look, mood: 'content', worn: { [t.slot]: id }, viewBox: SLOT_VIEW[t.slot] });
}

// A round passport stamp. The angle and ink colour come from the place name, so they never change.
function stampSVG(stamp, uid) {
  const inks = ['#2F5A8A', '#B2453E', '#2F6B4A', '#6B4C9A', '#8A5A2B'];
  const h = hash32(stamp.label);
  const ink = inks[h % inks.length];
  const rot = (h % 25) - 12;
  const top = stamp.town.toUpperCase();
  const fs = top.length > 16 ? 8.5 : top.length > 11 ? 10 : 11.5;
  const date = new Date(stamp.first).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let mid;
  if (!stamp.district) {
    mid = `<text x="60" y="59" text-anchor="middle" font-size="14" fill="${ink}">★</text>`;
  } else if (stamp.district.length <= 12) {
    mid = `<text x="60" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="${ink}">${esc(stamp.district)}</text>`;
  } else {
    // Long district names go on two lines, split at the space nearest the middle.
    const words = stamp.district.split(' ');
    let best = 1, bestDiff = Infinity;
    for (let i = 1; i < words.length; i++) {
      const diff = Math.abs(words.slice(0, i).join(' ').length - words.slice(i).join(' ').length);
      if (diff < bestDiff) { bestDiff = diff; best = i; }
    }
    const lines = words.length > 1 ? [words.slice(0, best).join(' '), words.slice(best).join(' ')] : [stamp.district];
    const size = Math.max(...lines.map(l => l.length)) > 13 ? 7.5 : 9;
    mid = lines.map((l, i) => `<text x="60" y="${lines.length > 1 ? 50 + i * 10 : 58}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${ink}">${esc(l)}</text>`).join('');
  }
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${esc(stamp.label)}, first visit ${esc(date)}">
    <g transform="rotate(${rot} 60 60)" opacity=".88" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
      <circle cx="60" cy="60" r="54" fill="none" stroke="${ink}" stroke-width="3"/>
      <circle cx="60" cy="60" r="38" fill="none" stroke="${ink}" stroke-width="1.2"/>
      <path id="arc-${uid}" d="M 16 60 A 44 44 0 0 1 104 60" fill="none"/>
      <text font-size="${fs}" font-weight="700" letter-spacing="1" fill="${ink}">
        <textPath href="#arc-${uid}" startOffset="50%" text-anchor="middle">${esc(top)}</textPath>
      </text>
      ${mid}
      <text x="60" y="72" text-anchor="middle" font-size="8.5" fill="${ink}">${esc(date)}</text>
      <text x="60" y="84" text-anchor="middle" font-size="8.5" fill="${ink}">${stamp.spots} ${stamp.spots === 1 ? 'spot' : 'spots'}</text>
    </g>
  </svg>`;
}
